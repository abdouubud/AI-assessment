<!-- radar V15 : radar simple, analyse + recommandations fusionnées par axe (grille radar | cartes), sans section WeNego Solutions -->
<!-- Logo : lien vers https://www.wenego.fr/?lang=en ou ?lang=fr selon la langue active -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Maturity Diagnostic</title>
<style>
  :root{
    --navy:#1B2A4A; --gold:#C9A227; --anth:#2B2F36;
    --bg:#F5F6F8; --card:#FFFFFF; --line:#E2E5EA; --muted:#6B7280;
    --navy-soft:rgba(27,42,74,.14);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --navy:#4C6FB0; --gold:#D9B84A; --anth:#E8EAED;
      --bg:#14161A; --card:#1E2126; --line:#31353C; --muted:#9AA0AA;
      --navy-soft:rgba(76,111,176,.22);
    }
  }
  :root[data-theme="dark"]{
    --navy:#4C6FB0; --gold:#D9B84A; --anth:#E8EAED;
    --bg:#14161A; --card:#1E2126; --line:#31353C; --muted:#9AA0AA;
    --navy-soft:rgba(76,111,176,.22);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--anth);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; font-size:15px;
  }
  .wrap{max-width:820px; margin:0 auto; padding:18px 16px 40px}

  /* barre du haut : [ logo (gauche) | titre (centre) | langue (droite) ] */
  .topbar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:10px 14px; margin-bottom:14px;
    background:var(--card); border:1px solid var(--line); border-radius:12px}
  .topbar .brand{grid-column:1; justify-self:start; display:inline-flex; align-items:center; border:0; background:none; padding:0; border-radius:4px; cursor:pointer; text-decoration:none}
  .topbar .brand:hover{background:none; opacity:.85}
  .topbar .brand:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  .topbar .brand .logo{height:24px; width:auto; display:block}
  .topbar .brand .logo-txt{font-size:14px; font-weight:800; letter-spacing:.5px; color:var(--navy)}
  .topbar .tb-title{grid-column:2; text-align:center; font-size:17px; font-weight:800; color:var(--navy); line-height:1.2; white-space:nowrap}
  .topbar .langbar{grid-column:3; justify-self:end}
  @media (max-width:560px){
    .topbar{grid-template-columns:auto 1fr auto; gap:8px; padding:8px 10px}
    .topbar .brand .logo{height:18px}
    .topbar .tb-title{font-size:13.5px; white-space:normal}
  }

  /* bouton Accueil (bas de page, pages 2+) */
  .navfoot{display:flex; justify-content:center; margin-top:14px}
  .homebtn{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; font-size:13px}
  .homebtn svg{width:16px; height:16px; flex:none}

  /* radar latéral (desktop, pendant le remplissage) */
  .side-radar{display:none}
  .side-radar .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px}
  .side-radar h3{margin:0 0 8px; font-size:12px; color:var(--navy); text-align:center; text-transform:uppercase; letter-spacing:.4px}
  .side-radar canvas{width:100%; height:auto; display:block}
  @media (min-width:960px){
    .wrap.filling{
      max-width:1120px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 405px;
      grid-template-areas:"top top" "steps steps" "app radar";
      column-gap:26px; align-items:start;
    }
    .wrap.filling .topbar{grid-area:top}
    .wrap.filling .steps{grid-area:steps}
    .wrap.filling #app{grid-area:app; min-width:0}
    .wrap.filling .side-radar{grid-area:radar; display:block; position:sticky; top:calc(16px + env(safe-area-inset-top,0px))}
  }

  /* progress */
  .steps{display:flex; align-items:center; gap:8px; margin-bottom:14px}
  .wrap.intro .steps{display:none}
  .steps .bar{flex:1; height:6px; background:var(--line); border-radius:20px; overflow:hidden}
  .steps .bar > span{display:block; height:100%; width:0; background:var(--gold); transition:width .25s}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px}
  .langbar{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card)}
  .langbar button{border:0; background:transparent; padding:6px 14px; font-size:12px; font-weight:700; color:var(--anth); cursor:pointer; letter-spacing:.3px; border-radius:0}
  .langbar button.on{background:var(--navy); color:#fff}
  .screen{display:none}
  .screen.active{display:block; animation:fade .2s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .screen.active{animation:none} }

  /* intro */
  .hero-visual{display:block; width:100%; height:auto; border-radius:10px; border:1px solid var(--line); background:#fff; margin:0 0 16px}
  .intro p{margin:0 0 12px; font-size:16px; line-height:1.55}
  .intro ul{margin:0 0 10px; padding-left:20px}
  .intro li{margin:0 0 7px; font-size:16px; line-height:1.5}
  .intro li b{color:var(--navy)}
  .intro .conf{font-style:italic; color:var(--muted); font-size:14px; margin-bottom:4px}

  h2.axe-title{margin:0 0 2px; font-size:18px; color:var(--navy)}
  .axe-sub{margin:0 0 14px; font-size:13px; color:var(--muted)}

  .q{padding:12px 0; border-top:1px solid var(--line)}
  .q:first-of-type{border-top:none}
  .q .qt{font-weight:600; font-size:14.5px; margin:0 0 9px}
  .q .qt .num{color:var(--gold); font-weight:700}
  .opts{display:grid; gap:7px}
  label.opt{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; cursor:pointer; color:var(--anth)}
  label.opt:hover{border-color:var(--navy)}
  label.opt input{margin-top:2px; accent-color:var(--gold)}
  label.opt.checked{border-color:var(--gold); background:var(--navy-soft)}

  /* nav */
  .nav{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line)}
  .nav .back{justify-self:start}
  .nav .back.hide{visibility:hidden}
  .nav .primary{justify-self:end}
  .nav .pageno{justify-self:center; font-size:12.5px; font-weight:700; color:var(--muted); white-space:nowrap}
  button{font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--navy); background:var(--card); color:var(--navy); padding:11px 18px; font-size:14px; font-weight:700}
  button.primary{background:var(--gold); border-color:var(--gold); color:#1B2A4A}
  button.primary:hover{filter:brightness(.95)}
  button.back:hover, button.homebtn:hover{background:var(--navy); color:#fff}
  button:disabled{opacity:.35; cursor:default; background:var(--card); color:var(--muted); border-color:var(--line)}
  button:focus-visible, summary:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* result */
  canvas{width:100%; height:auto; display:block}
  .result-title{margin:0 0 6px; font-size:21px; font-weight:700; color:var(--navy); text-align:center}
  .result-title #gscore{color:var(--gold)}
  .result-level{margin:0 0 16px; text-align:center; font-size:13.5px; color:var(--muted)}
  .result-level b{color:var(--navy)}
  .axscore{margin-left:auto; font-weight:700; color:var(--gold); font-size:12.5px; white-space:nowrap}
  .axscore .lab{color:var(--muted); font-weight:600; margin-right:5px}
  .diagram-card{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .wrap.result{max-width:1180px}
  .wrap.result .steps{display:none}

  /* résultat : radar (gauche) | synthèse + analyse & recommandations par axe (droite) */
  .rgrid{display:grid; grid-template-columns:minmax(0,1fr); gap:24px; align-items:start}
  @media (min-width:900px){
    .rgrid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
    .rleft{position:sticky; top:calc(16px + env(safe-area-inset-top,0px))}
  }
  .rright h3.rh{margin:0 0 8px; font-size:18px; color:var(--navy)}
  .rright .sec-sub{margin:0 0 12px; font-size:13px; color:var(--muted)}

  .sumgrid{display:grid; gap:12px; margin:0 0 22px}
  @media (min-width:720px){ .sumgrid{grid-template-columns:1fr 1fr} }
  .sumcard{border:1px solid var(--line); border-radius:10px; padding:12px 14px}
  .sumcard h4{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted)}
  .sumcard ul{margin:0; padding-left:18px; font-size:13.5px}
  .sumcard li{margin:0 0 4px}
  .sumcard li b{color:var(--navy)}
  .sumcard.full{grid-column:1/-1; font-size:13.5px}
  .sumcard.full p{margin:0 0 6px}
  .sumcard.full p:last-child{margin:0}

  /* formulaire rapport */
  .report-form{margin-top:26px; border:1px solid var(--gold); border-radius:12px; padding:18px; background:var(--navy-soft)}
  .report-form h3{margin:0 0 4px; font-size:18px; color:var(--navy)}
  .report-form .sub{margin:0 0 14px; font-size:13px; color:var(--muted)}
  .fgrid{display:grid; gap:12px}
  @media (min-width:640px){ .fgrid{grid-template-columns:1fr 1fr} }
  .fgrid .full{grid-column:1/-1}
  .fgrid label{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:700; color:var(--anth)}
  .fgrid label .req{color:#C0392B; margin-left:3px}
  .fgrid input, .fgrid textarea{font:inherit; font-size:14px; font-weight:400; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--anth); width:100%}
  .fgrid textarea{min-height:96px; resize:vertical; line-height:1.4}
  .fgrid input:focus, .fgrid textarea:focus{outline:2px solid var(--gold); outline-offset:0; border-color:var(--gold)}
  .fgrid input.err{border-color:#C0392B}
  .factions{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px}
  .fmsg{font-size:13px; color:var(--navy); flex:1; min-width:220px}
  .fmsg.busy{color:var(--muted)}
  .fmsg.err{color:#C0392B}

  /* cartes dépliables (axe + recommandations) */
  .xp{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden}
  .xp>summary{cursor:pointer; list-style:none; padding:11px 13px; font-weight:700; color:var(--navy); background:var(--navy-soft); display:flex; align-items:center; gap:8px}
  .xp>summary::-webkit-details-marker{display:none}
  .xp>summary::after{content:""; flex:none; align-self:center; margin-left:8px; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); transition:transform .15s}
  .xp[open]>summary::after{transform:rotate(-135deg)}
  .xp>summary .n{color:var(--gold)}
  .xp>summary .st{flex:1}
  .xp.prio{border-color:var(--gold)}
  .xp .tag{font-size:11px; font-weight:700; color:#1B2A4A; background:var(--gold); border-radius:999px; padding:2px 8px; white-space:nowrap}
  .xp .xpbody{padding:11px 13px; font-size:13.5px}
  .xp .xpbody p{margin:0 0 8px}
  .xp .xpbody ul{margin:0 0 4px; padding-left:18px}
  .xp .xpbody li{margin:0 0 4px}
  .xp .k{color:var(--navy); font-weight:700}
  .xp .recbox{margin-top:10px; padding:10px 12px; border-left:3px solid var(--gold); background:var(--navy-soft); border-radius:0 6px 6px 0}
  .xp .recbox .rech{margin:0 0 3px; font-size:12.5px; font-weight:700; color:var(--gold)}
  .xp .recbox .lead{font-weight:700; font-style:italic; color:var(--navy)}
  @media (max-width:560px){
    .panel{padding:14px}
    .xp>summary{flex-wrap:wrap; row-gap:4px}
    .xp>summary .st{flex:1 1 60%}
    .factions button{width:100%}
    .result-title{font-size:19px}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  catch(e){ return null; }
}

}

// ================= construction des écrans =================
const app = document.getElementById('app');
const HOME_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function buildScreens(){
  const U = UI[LANG], R = REPORT[LANG];
  app.innerHTML = '';

  // --- écran 0 : intro ---
  const intro = document.createElement('section');
  intro.className='screen panel intro'; intro.dataset.i='0';
  intro.innerHTML = `
    ${HERO_SRC && HERO_SRC.startsWith('data:') ? `<img class="hero-visual" src="${HERO_SRC}" alt="" onerror="this.style.display='none'">` : ''}
    ${U.introP.map(p=>`<p>${p}</p>`).join('')}
    <ul>${U.introAxes.map(li=>`<li>${li}</li>`).join('')}</ul>
    ${U.introEnd.map(p=>`<p>${p}</p>`).join('')}
    <p class="conf">${U.conf}</p>
  `;
  intro.appendChild(nav(0));
  app.appendChild(intro);

  // --- écrans 1..6 : axes ---
  AXES.forEach((ax,ai)=>{
    const s=document.createElement('section'); s.className='screen panel'; s.dataset.i=String(ai+1);
    const h=document.createElement('h2'); h.className='axe-title'; h.textContent=`${ai+1}. ${L(ax.label)}`;
    const sub=document.createElement('p'); sub.className='axe-sub'; sub.textContent=L(ax.sub);
    s.appendChild(h); s.appendChild(sub);
    ax.questions.forEach(q=>{
      const qd=document.createElement('div'); qd.className='q';
      qd.innerHTML=`<p class="qt"><span class="num">${U.qPrefix}${q.n}.</span> ${L(q.t)}</p>`;
      const opts=document.createElement('div'); opts.className='opts';
      L(q.o).forEach((txt,k)=>{
        const v=k+1; const lab=document.createElement('label'); lab.className='opt';
        lab.innerHTML=`<input type="radio" name="q${q.n}" value="${v}"><span>${txt}</span>`;
        const inp=lab.querySelector('input');
        if(answers[q.n]===v) inp.checked=true;
        inp.addEventListener('change',()=>{answers[q.n]=v; markChecked(); updateMini();});
        opts.appendChild(lab);
      });
      qd.appendChild(opts); s.appendChild(qd);
    });
    s.appendChild(nav(ai+1));
    s.appendChild(navFoot());
    app.appendChild(s);
  });

  // --- écran 7 : résultat (grille : radar | synthèse + axes & recommandations) ---
  const res=document.createElement('section'); res.className='screen panel'; res.dataset.i=String(LAST);
  const fv=k=>escAttr(formData[k]||'');
  const req='<span class="req" aria-hidden="true">*</span>';
  res.innerHTML=`
    <h2 class="result-title">${U.resultTitle} : <span id="gscore">—</span> / 5</h2>
    <p class="result-level" id="glevel"></p>
    <div class="rgrid">
      <div class="rleft">
        <div class="diagram-card"><canvas id="radar" width="1100" height="860" aria-label="${U.diagramTitle}"></canvas></div>
      </div>
      <div class="rright">
        <h3 class="rh">${U.summaryH}</h3>
        <div class="sumgrid" id="sumgrid"></div>
        <h3 class="rh">${U.axesRecH}</h3>
        <p class="sec-sub">${R.axesSub}</p>
        <div id="axisList"></div>
      </div>
    </div>
    <div class="report-form" id="reportForm">
      <h3>${U.formTitle}</h3>
      <p class="sub">${U.formSub}</p>
      <div class="fgrid">
        <label><span>${U.fFirst}${req}</span><input type="text" id="fFirst" autocomplete="given-name" required value="${fv('fFirst')}"></label>
        <label><span>${U.fLast}${req}</span><input type="text" id="fLast" autocomplete="family-name" required value="${fv('fLast')}"></label>
        <label><span>${U.fEmail}${req}</span><input type="email" id="fEmail" autocomplete="email" required value="${fv('fEmail')}"></label>
        <label><span>${U.fCompany}${req}</span><input type="text" id="fCompany" autocomplete="organization" required value="${fv('fCompany')}"></label>
        <label class="full"><span>${U.fFeedback}</span><textarea id="fFeedback" rows="4" placeholder="${escAttr(U.fFeedbackPh)}">${escAttr(formData.fFeedback||'')}</textarea></label>
      </div>
      <div class="factions">
        <button class="primary" id="pdfBtn" type="button">${U.fBtn}</button>
        <span class="fmsg" id="fmsg" role="status">${U.fNote}</span>
      </div>
    </div>
  `;
  res.appendChild(nav(LAST));
  res.appendChild(navFoot());
  app.appendChild(res);

  bindRadarCanvas();
  ['fFirst','fLast','fEmail','fCompany','fFeedback'].forEach(id=>{const el=document.getElementById(id); el.addEventListener('input',()=>{formData[id]=el.value; el.classList.remove('err');});});
  document.getElementById('pdfBtn').addEventListener('click',onPdf);
}

function setLang(lang){
  if(lang===LANG) return;
  LANG = lang;
  applyLangChrome();
  syncUrl();
  buildScreens();
  markChecked();
  go(cur);
}
function applyLangChrome(){
  const U = UI[LANG];
  document.documentElement.lang = U.htmlLang;
  document.title = U.hTitle;
  document.getElementById('brandBtn').href = SITE_URL + '?lang=' + LANG;   // logo -> wenego.fr dans la langue active
  document.getElementById('phTitle').textContent = U.hTitle;
  document.getElementById('miniTitle').textContent = U.miniTitle;
  document.querySelectorAll('#langbar button').forEach(b=>{
    const on = b.dataset.lang===LANG;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

// ================= navigation =================
function nav(i){
  const U = UI[LANG];
  const n=document.createElement('div'); n.className='nav';
  const back=document.createElement('button'); back.className='back'; back.type='button'; back.innerHTML=U.back;
  const next=document.createElement('button'); next.className='primary'; next.type='button';
  if(i===0){ back.classList.add('hide'); back.tabIndex=-1; back.setAttribute('aria-hidden','true'); next.innerHTML=U.start; }
  else if(i===NAX){ next.innerHTML=U.toResult; }
  else if(i===LAST){ next.innerHTML=U.restart; }
  else{ next.innerHTML=U.next; }
  back.addEventListener('click',()=>go(i-1));
  next.addEventListener('click',()=>{ if(i===LAST){reset();} else {go(i+1);} });
  const page=document.createElement('div'); page.className='pageno';
  page.textContent = (i>=1 && i<=NAX) ? `${U.page} ${i} / ${NAX}` : '';
  n.appendChild(back); n.appendChild(page); n.appendChild(next);
  return n;
}
function navFoot(){
  const f=document.createElement('div'); f.className='navfoot';
  const b=document.createElement('button'); b.type='button'; b.className='homebtn';
  b.innerHTML = HOME_SVG + `<span>${UI[LANG].home}</span>`;
  b.addEventListener('click',()=>go(0));
  f.appendChild(b); return f;
}
let cur=0;
function go(i){
  i=Math.max(0,Math.min(LAST,i));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', +s.dataset.i===i));
  cur=i;
  updateProgress();
  const filling = (i>=1 && i<=NAX);
  const wrap = document.querySelector('.wrap');
  wrap.classList.toggle('intro', i===0);
  wrap.classList.toggle('filling', filling);
  wrap.classList.toggle('result', i===LAST);
  document.querySelector('.side-radar').setAttribute('aria-hidden', filling?'false':'true');
  if(filling) updateMini();
  if(i===LAST) compute();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProgress(){
  const bar=document.getElementById('pbar');
  if(cur===0){ bar.style.width='0%'; }
  else if(cur===LAST){ bar.style.width='100%'; }
  else{ bar.style.width=(cur/NAX*100).toFixed(0)+'%'; }
}
function reset(){ for(const k in answers) delete answers[k]; document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false); markChecked(); go(0); }

function markChecked(){
  document.querySelectorAll('label.opt').forEach(l=>{const inp=l.querySelector('input'); l.classList.toggle('checked', inp.checked);});
}

// ================= scoring =================
function axisScore(ax){const v=ax.questions.map(q=>answers[q.n]).filter(x=>x); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null;}
function compute(){
  const scores=AXES.map(ax=>{const s=axisScore(ax); return s==null?null:s*5/4;});
  const done=scores.filter(x=>x!=null);
  const g=done.length? done.reduce((a,b)=>a+b,0)/done.length : null;
  const gs=document.getElementById('gscore'); if(gs) gs.textContent=fmtScore(g);
  lastScores=scores; lastGlobal=g;
  const gl=document.getElementById('glevel');
  if(gl) gl.innerHTML = g==null ? '' : `${UI[LANG].levelLbl} : <b>${UI[LANG].levels[levelOf(g)]}</b>`;
  renderSummary();
  renderAxes();
  drawRadar(lastScores);
}
function fmtScore(v){ const dec = LANG==='fr' ? ',' : '.'; return v==null?'—':v.toFixed(2).replace('.',dec); }

// ================= radar (écran résultat + PDF) — style « radar final » =================
const DIAG = {navy:'#1B2A4A', gold:'#C9A227', line:'#E2E5EA'};
const FONT = '-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
function drawRadarChart(canvas, vals, W, H, fs, rf=0.34){
  if(canvas.width!==W) canvas.width=W;
  if(canvas.height!==H) canvas.height=H;
  const c=canvas.getContext('2d');
  c.clearRect(0,0,W,H); c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  const N=AXES.length, cx=W/2, cy=H/2, R=Math.min(W,H)*rf;
  const ang=i=>(-Math.PI/2)+i*2*Math.PI/N, pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  // toile : 5 anneaux + graduations 1 → 5
  c.lineWidth=fs*0.05; c.strokeStyle=DIAG.line;
  for(let g=1;g<=5;g++){ const r=R*g/5; c.beginPath();
    for(let i=0;i<=N;i++){const[x,y]=pt(i%N,r); i?c.lineTo(x,y):c.moveTo(x,y);}
    c.stroke();
    c.fillStyle=DIAG.gold; c.font=`700 ${fs*0.62}px ${FONT}`; c.textAlign='left'; c.textBaseline='middle';
    c.fillText(String(g), cx+fs*0.2, cy-r); }
  // rayons
  for(let i=0;i<N;i++){const[x,y]=pt(i,R); c.beginPath(); c.moveTo(cx,cy); c.lineTo(x,y); c.stroke();}
  // zone des scores
  const idx=[]; for(let i=0;i<N;i++) if(vals[i]!=null) idx.push(i);
  if(idx.length>=2){
    c.beginPath(); idx.forEach((i,k)=>{const[x,y]=pt(i,R*vals[i]/5); k?c.lineTo(x,y):c.moveTo(x,y);});
    if(idx.length>=3){ c.closePath(); c.fillStyle='rgba(27,42,74,.22)'; c.fill(); }
    c.strokeStyle=DIAG.gold; c.lineWidth=fs*0.1; c.lineJoin='round'; c.stroke();
  }
  idx.forEach(i=>{const[x,y]=pt(i,R*vals[i]/5); c.beginPath(); c.arc(x,y,fs*0.2,0,Math.PI*2); c.fillStyle=DIAG.gold; c.fill(); c.strokeStyle='#fff'; c.lineWidth=fs*0.06; c.stroke();});
  // libellés : nom de l'axe + score
  for(let i=0;i<N;i++){
    const co=Math.cos(ang(i)), si=Math.sin(ang(i)), [lx,ly]=pt(i,R+fs*0.9), lh=fs*1.15;
    c.textAlign = Math.abs(co)<0.3?'center':(co>0?'left':'right');
    let y1,y2;
    if(si<-0.3){ c.textBaseline='bottom'; y2=ly; y1=ly-lh; }
    else if(si>0.3){ c.textBaseline='top'; y1=ly; y2=ly+lh; }
    else { c.textBaseline='middle'; y1=ly-lh/2; y2=ly+lh/2; }
    const name=(i+1)+'. '+L(AXES[i].label), pad=fs*0.3;
    c.font=`700 ${fs}px ${FONT}`; const tw=c.measureText(name).width;
    let x=lx; // garder le libellé dans le cadre (petits écrans)
    if(c.textAlign==='left' && x+tw>W-pad) x=W-pad-tw;
    if(c.textAlign==='right' && x-tw<pad) x=pad+tw;
    if(c.textAlign==='center') x=Math.max(pad+tw/2, Math.min(W-pad-tw/2, x));
    c.fillStyle=DIAG.navy; c.fillText(name, x, y1);
    c.fillStyle=DIAG.gold; c.font=`700 ${fs*0.85}px ${FONT}`; c.fillText(fmtScore(vals[i])+' / 5', x, y2);
  }
}
let cv;
function bindRadarCanvas(){ cv=document.getElementById('radar'); }
function drawRadar(vals){
  if(!cv) return;
  const w = cv.clientWidth || window.innerWidth;
  if(w < 520) drawRadarChart(cv, vals, 1000, 860, 46, 0.27);   // mobile : libellés plus gros
  else drawRadarChart(cv, vals, 1100, 860, 32);
}
let rsz; window.addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ if(cur===LAST) drawRadar(lastScores); },150); });

// ================= mini radar (latéral) =================
function cssvar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function hexA(hex,a){ if(hex.startsWith('#')){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;} return hex; }
const mcv=document.getElementById('miniRadar'), mctx=mcv.getContext('2d');
function miniScores(){ return AXES.map(ax=>{const s=axisScore(ax); return s==null?null:s*5/4;}); }
function updateMini(){ drawMini(miniScores()); }
function drawMini(vals){
  const W=mcv.width,H=mcv.height,cx=W/2,cy=H/2,R=Math.min(W,H)*0.32;
  const N=AXES.length,navy=cssvar('--navy'),gold=cssvar('--gold'),line=cssvar('--line');
  mctx.clearRect(0,0,W,H);
  const ang=i=>(-Math.PI/2)+i*2*Math.PI/N, pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  mctx.lineWidth=1; mctx.strokeStyle=line;
  for(let g=1;g<=5;g++){const r=R*g/5; mctx.beginPath();
    for(let i=0;i<=N;i++){const[x,y]=pt(i%N,r); i?mctx.lineTo(x,y):mctx.moveTo(x,y);} mctx.stroke();}
  mctx.fillStyle=navy; mctx.font='700 22px sans-serif';
  for(let i=0;i<N;i++){const[x,y]=pt(i,R); mctx.beginPath(); mctx.moveTo(cx,cy); mctx.lineTo(x,y); mctx.stroke();
    const[lx,ly]=pt(i,R+20);
    mctx.textAlign=Math.abs(Math.cos(ang(i)))<0.3?'center':(Math.cos(ang(i))>0?'left':'right');
    mctx.textBaseline=Math.sin(ang(i))>0.3?'top':(Math.sin(ang(i))<-0.3?'bottom':'middle');
    mctx.fillText((i+1)+'. '+L(AXES[i].label),lx,ly);}
  const idx=[]; for(let i=0;i<N;i++) if(vals[i]!=null) idx.push(i);
  if(idx.length>=3){
    mctx.beginPath(); idx.forEach((i,k)=>{const[x,y]=pt(i,R*vals[i]/5); k?mctx.lineTo(x,y):mctx.moveTo(x,y);});
    mctx.closePath(); mctx.fillStyle=hexA(navy,0.22); mctx.fill(); mctx.strokeStyle=gold; mctx.lineWidth=3; mctx.stroke();
  } else if(idx.length===2){
    const[a,b]=idx,[x1,y1]=pt(a,R*vals[a]/5),[x2,y2]=pt(b,R*vals[b]/5);
    mctx.beginPath(); mctx.moveTo(x1,y1); mctx.lineTo(x2,y2); mctx.strokeStyle=gold; mctx.lineWidth=3; mctx.stroke();
  }
  idx.forEach(i=>{const[x,y]=pt(i,R*vals[i]/5); mctx.beginPath(); mctx.arc(x,y,5,0,7); mctx.fillStyle=gold; mctx.fill(); mctx.strokeStyle='#fff'; mctx.lineWidth=1.5; mctx.stroke();});
}

// ================= synthèse + axes & recommandations =================
function levelOf(v){ return v<2?0 : v<3?1 : v<4?2 : 3; }
function analysis(){
  const U=UI[LANG];
  const rows=AXES.map((ax,i)=>({i, name:L(ax.label), v:lastScores[i]}));
  const done=rows.filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
  const strengths=done.slice(0,2), priorities=done.length>2 ? done.slice(-2).reverse() : [];
  let balance='';
  if(done.length>=2){
    const hi=done[0], lo=done[done.length-1];
    balance = (hi.v-lo.v>=1.5) ? U.gapNote(hi.name, lo.name) : U.evenNote;
  }
  return {rows, done, strengths, priorities, balance, incomplete: done.length<AXES.length};
}
function renderSummary(){
  const box=document.getElementById('sumgrid'); if(!box) return;
  const U=UI[LANG], A=analysis();
  if(!A.done.length){ box.innerHTML=''; return; }
  const li=r=>`<li><b>${r.i+1}. ${r.name}</b> — ${fmtScore(r.v)} / 5 · ${U.levels[levelOf(r.v)]}</li>`;
  box.innerHTML=`
    <div class="sumcard full">
      <p>${lastGlobal==null?'':U.levelDesc[levelOf(lastGlobal)]}</p>
      ${A.balance?`<p>${A.balance}</p>`:''}
      ${A.incomplete?`<p style="color:var(--muted)">${U.incomplete}</p>`:''}
    </div>
    <div class="sumcard"><h4>${U.strengthsH}</h4><ul>${A.strengths.map(li).join('')}</ul></div>
    ${A.priorities.length?`<div class="sumcard"><h4>${U.prioritiesH}</h4><ul>${A.priorities.map(li).join('')}</ul></div>`:''}
  `;
}
function renderAxes(){
  const box=document.getElementById('axisList'); if(!box) return;
  const U=UI[LANG], R=REPORT[LANG], A=analysis();
  box.innerHTML = AXES.map((ax,i)=>{
    const e=U.explains[i], r=R.rec[i], prio=A.priorities.some(x=>x.i===i);
    const open = prio || (!A.priorities.length && i===0);
    return `<details class="xp${prio?' prio':''}"${open?' open':''}><summary><span class="n">${i+1}.</span><span class="st">${e.sum}</span>
      ${prio?`<span class="tag">${esc(R.prioTag)}</span>`:''}
      <span class="axscore"><span class="lab">${U.yourScore}</span>${fmtScore(lastScores[i])}</span></summary>
      <div class="xpbody">
        <p><span class="k">${U.kDef}</span> ${e.def}</p>
        <p><span class="k">${U.kEx}</span> ${e.ex}</p>
        <p><span class="k">${U.kCrit}</span> ${e.crit}</p>
        <div class="recbox"><p class="rech">${esc(R.recH)}</p><p class="lead">${esc(r.s)}</p><ul>${r.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
      </div></details>`;
  }).join('');
}

// ================= formulaire + export PDF =================
function onPdf(){
  const U=UI[LANG], msg=document.getElementById('fmsg'), btn=document.getElementById('pdfBtn');
  const ids=['fFirst','fLast','fEmail','fCompany'];
  const v={}; let missing=false;
  ids.forEach(id=>{ const el=document.getElementById(id); v[id]=el.value.trim(); formData[id]=el.value; el.classList.toggle('err', !v[id]); if(!v[id]) missing=true; });
  v.fFeedback = document.getElementById('fFeedback').value.trim();
  msg.className='fmsg';
  if(missing){ msg.textContent=U.fErrReq; msg.classList.add('err'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.fEmail)){ document.getElementById('fEmail').classList.add('err'); msg.textContent=U.fErrEmail; msg.classList.add('err'); return; }
  if(!(window.jspdf && window.jspdf.jsPDF)){ msg.textContent=U.fErrLib; msg.classList.add('err'); return; }
  btn.disabled=true; msg.textContent=U.fBusy; msg.classList.add('busy');
  setTimeout(()=>{
    try{
      buildPdf({first:v.fFirst, last:v.fLast, email:v.fEmail, company:v.fCompany});
      msg.className='fmsg'; msg.textContent=U.fNote;
      logToSheet(v);
    }catch(e){ console.error(e); msg.className='fmsg err'; msg.textContent=U.fErrLib; }
    btn.disabled=false;
  },30);
}
function logToSheet(v){
  if(!SHEET_URL) return;
  const r2=x=>x==null?'':Math.round(x*100)/100;
  const payload={ firstName:v.fFirst, lastName:v.fLast, email:v.fEmail, company:v.fCompany, lang:LANG,
    global:r2(lastGlobal), level: lastGlobal==null?'':UI.en.levels[levelOf(lastGlobal)],
    feedback:v.fFeedback||'', scores:{}, answers:{} };
  AXES.forEach((ax,i)=>{ payload.scores[ax.key]=r2(lastScores[i]); ax.questions.forEach(q=>{ payload.answers['Q'+q.n]=answers[q.n]||''; }); });
  fetch(SHEET_URL,{method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)}).catch(()=>{});
}
function buildPdf(p){
  const U=UI[LANG], R=REPORT[LANG], A=analysis();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const PW=210, PH=297, M=14, CW=PW-2*M, BOTTOM=PH-14;
  const NAVY=[27,42,74], GOLD=[201,162,39], INK=[43,47,54], MUTED=[107,114,128], LINE=[226,229,234], SOFT=[237,239,244];
  let y=0;
  // police PDF standard (WinAnsi) : on remplace les caractères non pris en charge
  const T=(t)=>String(t).replace(/[\u2009\u202F]/g,' ').replace(/\u2192/g,'->');
  const setC=(c)=>doc.setTextColor(c[0],c[1],c[2]);
  const newPage=()=>{ doc.addPage(); y=M; };
  const ensure=(h)=>{ if(y+h > BOTTOM) newPage(); };
  const para=(text,size=9.5,color=INK,style='normal',lh=1.32,x=M,w=CW)=>{
    doc.setFont('helvetica',style); doc.setFontSize(size); setC(color);
    const lines=doc.splitTextToSize(T(text), w), step=size*0.3528*lh;
    lines.forEach(l=>{ ensure(step); doc.text(l, x, y+step*0.75); y+=step; });
  };
  // texte riche : segments [texte, 'b'|'i'|undefined], retour à la ligne mot par mot
  const rich=(segs,size=9,x=M,w=CW,lh=1.3,color=INK)=>{
    const step=size*0.3528*lh; doc.setFontSize(size);
    const lines=[]; let line=[], lw=0;
    segs.forEach(([txt,st])=>{
      const style = st==='b'?'bold':st==='i'?'italic':'normal', col = st==='b'?NAVY:color;
      doc.setFont('helvetica',style);
      T(txt).split(/(\s+)/).forEach(tok=>{
        if(!tok) return;
        if(/^\s+$/.test(tok)){ if(line.length){ const sw=doc.getTextWidth(' '); line.push({t:' ',s:style,c:col,w:sw}); lw+=sw; } return; }
        const tw=doc.getTextWidth(tok);
        if(lw+tw>w && line.length){
          while(line.length && line[line.length-1].t===' '){ lw-=line.pop().w; }
          lines.push(line); line=[]; lw=0;
        }
        line.push({t:tok,s:style,c:col,w:tw}); lw+=tw;
      });
    });
    if(line.length) lines.push(line);
    lines.forEach(ln=>{
      ensure(step); let xx=x;
      ln.forEach(pc=>{ doc.setFont('helvetica',pc.s); setC(pc.c); doc.text(pc.t, xx, y+step*0.75); xx+=pc.w; });
      y+=step;
    });
  };
  const bullet=(segs,size=9)=>{
    ensure(size*0.3528*1.3);
    doc.setFont('helvetica','bold'); doc.setFontSize(size); setC(GOLD);
    doc.text('•', M+1.5, y+size*0.3528*1.3*0.75);
    rich(segs,size,M+5,CW-5); y+=0.4;
  };
  const h2=(text)=>{
    ensure(30); y+=1.5;
    doc.setFillColor(...GOLD); doc.rect(M, y+0.8, 2.4, 5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12.5); setC(NAVY); doc.text(T(text), M+5, y+5);
    y+=8.5;
  };

  // --- en-tête (bandeau fin) ---
  doc.setFillColor(...NAVY); doc.rect(0,0,PW,14,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); setC(GOLD); doc.text('WENEGO', M, 9);
  doc.setFontSize(13); doc.setTextColor(255,255,255); doc.text(T(U.pdfTitle), PW-M, 9.3, {align:'right'});
  y=19;

  // --- score (en haut) ---
  {
    const lvl = lastGlobal==null ? null : levelOf(lastGlobal);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    const desc = lvl==null ? [] : doc.splitTextToSize(T(U.levelDesc[lvl]), CW-14);
    const bh = 17 + desc.length*3.9 + (desc.length?1.5:0);
    doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, bh, 2, 2, 'F');
    doc.setFillColor(...GOLD); doc.rect(M, y, 2.4, bh, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); setC(MUTED); doc.text(T(U.resultTitle).toUpperCase(), M+7, y+6);
    doc.setFontSize(19); setC(GOLD); doc.text(fmtScore(lastGlobal)+' / 5', M+7, y+14);
    if(lvl!=null){
      doc.setFontSize(8); setC(MUTED); doc.text(T(U.levelLbl).toUpperCase(), M+CW-6, y+6, {align:'right'});
      doc.setFontSize(13); setC(NAVY); doc.text(T(U.levels[lvl]), M+CW-6, y+13, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(9); setC(INK);
      desc.forEach((l,j)=>doc.text(l, M+7, y+19.5+j*3.9));
    }
    y+=bh+3.5;
  }

  // --- participant ---
  const date=new Date().toLocaleDateString(LANG==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'});
  const info=[[U.pdfFor, p.first+' '+p.last],[U.pdfCompany, p.company],[U.pdfEmail, p.email],[U.pdfDate, date]];
  doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.roundedRect(M, y, CW, 19, 2, 2, 'S');
  info.forEach((r,k)=>{
    const cx = M+4 + (k%2)*(CW/2), cy = y+7 + Math.floor(k/2)*8;
    doc.setFont('helvetica','bold'); doc.setFontSize(7); setC(MUTED); doc.text(T(r[0]).toUpperCase(), cx, cy-2.8);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); setC(NAVY);
    doc.text(doc.splitTextToSize(T(r[1]), CW/2-10)[0], cx, cy+1.2);
  });
  y+=22;

  // --- introduction ---
  h2(U.pdfIntroH);
  U.pdfIntro.forEach(t=>{ para(t); y+=1; });
  U.introAxes.forEach(t=>{ para('•  '+t.replace(/<[^>]+>/g,''), 9, INK, 'normal', 1.3, M+2, CW-2); });
  y+=1;

  // --- diagramme (radar simple) ---
  const off=document.createElement('canvas');
  drawRadarChart(off, lastScores, 1650, 1290, 48);
  const imgW = 140, imgH = imgW * off.height / off.width;
  ensure(imgH+22);
  h2(U.pdfDiagramH);
  doc.addImage(off.toDataURL('image/jpeg',0.92),'JPEG', M+(CW-imgW)/2, y, imgW, imgH);
  y+=imgH+2;
  para(U.pdfDiagramNote, 8, MUTED, 'italic');
  y+=1;

  // --- synthèse ---
  h2(U.summaryH);
  if(A.balance){ para(A.balance); y+=1; }
  if(A.incomplete){ para(U.incomplete, 8.5, MUTED, 'italic'); y+=1; }

  ensure(10+AXES.length*6.5); y+=2.5;
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); setC(MUTED);
  doc.text(T(U.colAxis).toUpperCase(), M, y); doc.text(T(U.colScore).toUpperCase(), M+64, y); doc.text(T(U.colLevel).toUpperCase(), M+CW, y, {align:'right'});
  y+=1.8; doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, y, M+CW, y); y+=1;
  A.rows.forEach(r=>{
    const rowY=y+4.2;
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); setC(NAVY); doc.text(T((r.i+1)+'. '+r.name), M, rowY);
    const bx=M+64, bw=70;
    doc.setFillColor(...SOFT); doc.roundedRect(bx, rowY-2.8, bw, 3.2, 1.1, 1.1, 'F');
    if(r.v!=null){ doc.setFillColor(...GOLD); doc.roundedRect(bx, rowY-2.8, Math.max(2.2, bw*r.v/5), 3.2, 1.1, 1.1, 'F'); }
    setC(INK); doc.setFontSize(9); doc.text(fmtScore(r.v), bx+bw+3, rowY);
    doc.setFont('helvetica','normal'); setC(MUTED); doc.text(r.v==null?'—':T(U.levels[levelOf(r.v)]), M+CW, rowY, {align:'right'});
    y+=6.3; doc.line(M, y, M+CW, y); y+=0.3;
  });
  y+=3;

  const colW=(CW-5)/2;
  const listBox=(title, arr, x, y0)=>{
    let yy=y0+5.5;
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); setC(MUTED); doc.text(T(title).toUpperCase(), x+3.5, yy); yy+=5;
    arr.forEach(r=>{
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); setC(NAVY); doc.text(T((r.i+1)+'. '+r.name), x+3.5, yy);
      doc.setFont('helvetica','normal'); setC(INK); doc.text(fmtScore(r.v)+' / 5 · '+T(U.levels[levelOf(r.v)]), x+colW-3.5, yy, {align:'right'});
      yy+=5;
    });
  };
  if(A.strengths.length){
    const boxH = 9 + Math.max(A.strengths.length, A.priorities.length)*5;
    ensure(boxH+2);
    doc.setDrawColor(...LINE); doc.roundedRect(M, y, colW, boxH, 2, 2, 'S');
    listBox(U.strengthsH, A.strengths, M, y);
    if(A.priorities.length){ doc.roundedRect(M+colW+5, y, colW, boxH, 2, 2, 'S'); listBox(U.prioritiesH, A.priorities, M+colW+5, y); }
    y+=boxH+2;
  }

  // --- explication des axes ---
  y+=2;
  h2(U.pdfAxesH);
  U.explains.forEach((e,i)=>{
    ensure(24);
    doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, 7, 1.5, 1.5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); setC(GOLD); doc.text((i+1)+'.', M+2.5, y+4.9);
    setC(NAVY); doc.text(T(e.sum), M+8, y+4.9);
    doc.setFontSize(9); setC(GOLD); doc.text(T(U.yourScore)+(LANG==='fr'?' : ':': ')+fmtScore(lastScores[i])+' / 5', M+CW-2.5, y+4.9, {align:'right'});
    y+=8.5;
    [[U.kDef,e.def],[U.kEx,e.ex],[U.kCrit,e.crit]].forEach(([k,t])=>{
      rich([[k+' ','b'],[t]], 9, M+2, CW-4); y+=0.6;
    });
    y+=1.8;
  });

  // --- recommandations par axe ---
  y+=2;
  h2(R.recH);
  para(R.recSub, 9, MUTED, 'italic'); y+=1.5;
  R.rec.forEach((r,i)=>{
    ensure(22);
    const isPrio = A.priorities.some(x=>x.i===i);
    doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, 7, 1.5, 1.5, 'F');
    if(isPrio){ doc.setFillColor(...GOLD); doc.rect(M, y, 2, 7, 'F'); }
    doc.setFont('helvetica','bold'); doc.setFontSize(10); setC(GOLD); doc.text((i+1)+'.', M+3.5, y+4.9);
    setC(NAVY); doc.text(T(r.t), M+9, y+4.9);
    doc.setFontSize(8.5); setC(GOLD);
    const right = (isPrio ? T(R.prioTag)+'  ·  ' : '') + fmtScore(lastScores[i])+' / 5';
    doc.text(right, M+CW-2.5, y+4.9, {align:'right'});
    y+=8.5;
    para(r.s, 9, NAVY, 'bolditalic', 1.28); y+=0.6;
    r.items.forEach(t=>bullet([[t]]));
    y+=2;
  });

  // --- pieds de page ---
  const n=doc.getNumberOfPages();
  for(let k=1;k<=n;k++){
    doc.setPage(k);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, PH-10, PW-M, PH-10);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); setC(MUTED);
    doc.text(T(U.pdfFooter), M, PH-6); doc.text(k+' / '+n, PW-M, PH-6, {align:'right'});
  }

  const safe=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  doc.save(`${U.fileBase}_${safe(p.company)||'Rapport'}_${safe(p.last)}.pdf`);
}

matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{ if(cur>=1&&cur<=NAX) updateMini(); });

// ================= barre du haut : switch de langue (le logo est un lien vers wenego.fr) =================
document.querySelectorAll('#langbar button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

applyLangChrome();
syncUrl();
buildScreens();
go(0);
</script>
