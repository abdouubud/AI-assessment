<!-- radar-test V11 : diagramme toile + formulaire + export PDF -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnostic IA — Test du radar</title>
<style>
  :root{
    --navy:#1B2A4A; --gold:#C9A227; --anth:#2B2F36;
    --bg:#F5F6F8; --card:#FFFFFF; --line:#E2E5EA; --muted:#6B7280;
    --navy-soft:rgba(27,42,74,.14);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --navy:#4C6FB0; --gold:#D9B84A; --anth:#E8EAED;
      --bg:#14161A; --card:#1E2126; --line:#31353C; --muted:#9AA0AA;
      --navy-soft:rgba(76,111,176,.22);
    }
  }
  :root[data-theme="dark"]{
    --navy:#4C6FB0; --gold:#D9B84A; --anth:#E8EAED;
    --bg:#14161A; --card:#1E2126; --line:#31353C; --muted:#9AA0AA;
    --navy-soft:rgba(76,111,176,.22);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--anth);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; font-size:15px;
  }
  header{
    background:var(--navy); color:#fff;
    padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;
  }
  header .brand{font-weight:700; letter-spacing:.5px; font-size:13px; color:var(--gold); text-transform:uppercase}
  header h1{margin:4px 0 0; font-size:19px; font-weight:700}
  .wrap{max-width:820px; margin:0 auto; padding:18px 16px 40px}

  /* radar latéral (desktop, pendant le remplissage) */
  .side-radar{display:none}
  .side-radar .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px}
  .side-radar h3{margin:0 0 8px; font-size:12px; color:var(--navy); text-align:center; text-transform:uppercase; letter-spacing:.4px}
  .side-radar canvas{width:100%; height:auto; display:block}
  .side-radar .hint{margin:8px 0 0; font-size:11px; color:var(--muted); text-align:center}
  @media (min-width:960px){
    .wrap.filling{
      max-width:1120px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 405px;
      grid-template-areas:"steps steps" "app radar";
      column-gap:26px; align-items:start;
    }
    .wrap.filling .steps{grid-area:steps}
    .wrap.filling #app{grid-area:app; min-width:0}
    .wrap.filling .side-radar{grid-area:radar; display:block; position:sticky; top:calc(16px + env(safe-area-inset-top,0px))}
  }

  /* progress */
  .steps{display:flex; align-items:center; gap:8px; margin-bottom:14px}
  .steps .bar{flex:1; height:6px; background:var(--line); border-radius:20px; overflow:hidden}
  .steps .bar > span{display:block; height:100%; width:0; background:var(--gold); transition:width .25s}
  .steps .lbl{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; min-width:78px; text-align:right}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px}
  .intro{position:relative}
  .langbar{position:absolute; top:14px; right:14px; display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card)}
  .langbar button{border:0; background:transparent; padding:6px 14px; font-size:12px; font-weight:700; color:var(--anth); cursor:pointer; letter-spacing:.3px}
  .langbar button.on{background:var(--navy); color:#fff}
  .screen{display:none}
  .screen.active{display:block; animation:fade .2s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1;transform:none}}

  /* intro */
  .visual-placeholder{
    border:2px dashed var(--line); border-radius:10px; background:var(--navy-soft);
    min-height:150px; display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--muted); font-size:13px; margin:0 0 16px; padding:16px;
  }
  .hero-visual{display:block; width:100%; height:auto; border-radius:10px; border:1px solid var(--line); background:#fff; margin:38px 0 16px}
  .intro p{margin:0 0 10px; font-size:14px}
  .intro ul{margin:0 0 10px; padding-left:20px}
  .intro li{margin:0 0 5px; font-size:14px}
  .intro li b{color:var(--navy)}
  .intro .conf{font-style:italic; color:var(--muted); font-size:12.5px; margin-bottom:4px}

  h2.axe-title{margin:0 0 2px; font-size:18px; color:var(--navy)}
  .axe-sub{margin:0 0 14px; font-size:13px; color:var(--muted)}

  .q{padding:12px 0; border-top:1px solid var(--line)}
  .q:first-of-type{border-top:none}
  .q .qt{font-weight:600; font-size:14.5px; margin:0 0 9px}
  .q .qt .num{color:var(--gold); font-weight:700}
  .opts{display:grid; gap:7px}
  label.opt{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; cursor:pointer; color:var(--anth)}
  label.opt:hover{border-color:var(--navy)}
  label.opt input{margin-top:2px; accent-color:var(--gold)}
  label.opt.checked{border-color:var(--gold); background:var(--navy-soft)}
  .lvl{margin-left:auto; font-size:11px; color:var(--muted); font-weight:700}

  /* nav */
  .nav{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line)}
  .nav .back{justify-self:start}
  .nav .primary{justify-self:end}
  .nav .pageno{justify-self:center; font-size:12.5px; font-weight:700; color:var(--muted); white-space:nowrap}
  button{font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--navy); background:var(--card); color:var(--navy); padding:11px 18px; font-size:14px; font-weight:700}
  button.primary{background:var(--gold); border-color:var(--gold); color:#1B2A4A}
  button.primary:hover{filter:brightness(.95)}
  button.back:hover{background:var(--navy); color:#fff}
  button:disabled{opacity:.35; cursor:default; background:var(--card); color:var(--muted); border-color:var(--line)}

  /* result */
  canvas{width:100%; height:auto; display:block}
  table{width:100%; border-collapse:collapse; margin-top:12px; font-size:13px}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px}
  td.val{text-align:right; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums}
  .global{margin-top:10px; font-size:13px; color:var(--muted)}
  .global b{color:var(--gold); font-size:16px}

  /* résultat : titre, diagramme pleine largeur, synthèse, axes, formulaire */
  .result-title{margin:0 0 6px; font-size:21px; font-weight:700; color:var(--navy); text-align:center}
  .result-title #gscore{color:var(--gold)}
  .result-level{margin:0 0 16px; text-align:center; font-size:13.5px; color:var(--muted)}
  .result-level b{color:var(--navy)}
  .axscore{margin-left:auto; font-weight:700; color:var(--gold); font-size:12.5px; white-space:nowrap}
  .axscore .lab{color:var(--muted); font-weight:600; margin-right:5px}
  .diagram-card{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin:0 0 18px}
  .diagram-card canvas{width:100%; height:auto; display:block}
  .wrap.result{max-width:1180px}
  .wrap.result .steps{display:none}
  .sumgrid{display:grid; gap:12px; margin:0 0 22px}
  @media (min-width:720px){ .sumgrid{grid-template-columns:1fr 1fr} }
  .sumcard{border:1px solid var(--line); border-radius:10px; padding:12px 14px}
  .sumcard h4{margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted)}
  .sumcard ul{margin:0; padding-left:18px; font-size:13.5px}
  .sumcard li{margin:0 0 4px}
  .sumcard li b{color:var(--navy)}
  .sumcard.full{grid-column:1/-1; font-size:13.5px}
  .sumcard.full p{margin:0 0 6px}
  .sumcard.full p:last-child{margin:0}

  /* formulaire rapport */
  .report-form{margin-top:22px; border:1px solid var(--gold); border-radius:12px; padding:18px; background:var(--navy-soft)}
  .report-form h3{margin:0 0 4px; font-size:18px; color:var(--navy)}
  .report-form .sub{margin:0 0 14px; font-size:13px; color:var(--muted)}
  .fgrid{display:grid; gap:12px}
  @media (min-width:640px){ .fgrid{grid-template-columns:1fr 1fr} }
  .fgrid label{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:700; color:var(--anth)}
  .fgrid input{font:inherit; font-size:14px; font-weight:400; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--anth); width:100%}
  .fgrid input:focus{outline:2px solid var(--gold); outline-offset:0; border-color:var(--gold)}
  .fgrid input.err{border-color:#C0392B}
  .factions{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px}
  .fmsg{font-size:13px; color:var(--muted)}
  .fmsg.err{color:#C0392B}
  .fmsg.ok{color:#2E7D4F; font-weight:700}

  /* explication des axes */
  .explain h3{margin:0 0 10px; font-size:18px; color:var(--navy); text-align:center}
  .xp{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden}
  .xp>summary{cursor:pointer; list-style:none; padding:11px 13px; font-weight:700; color:var(--navy); background:var(--navy-soft); display:flex; align-items:center; gap:8px}
  .xp>summary::-webkit-details-marker{display:none}
  .xp>summary::after{content:""; flex:none; align-self:center; margin-left:8px; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); transition:transform .15s}
  .xp[open]>summary::after{transform:rotate(-135deg)}
  .xp>summary .n{color:var(--gold)}
  .xp .xpbody{padding:11px 13px; font-size:13.5px}
  .xp .xpbody p{margin:0 0 8px}
  .xp .xpbody p:last-child{margin-bottom:0}
  .xp .k{color:var(--navy); font-weight:700}
  .diag-sep{margin:18px 0 0}
  .note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.4}

  /* test box */
  .testbox{margin-top:16px; border:1px dashed var(--line); border-radius:10px; padding:12px}
  .testbox .t{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:8px}
  .tools{display:flex; flex-wrap:wrap; gap:8px}
  .tools button{padding:7px 11px; font-size:12px; font-weight:600}
  .tools button.ghost{border-color:var(--line); color:var(--muted); background:var(--card)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header>
  <div class="brand">WeNego</div>
  <h1 id="hTitle">Diagnostic de maturité IA</h1>
</header>

<div class="wrap">
  <div class="steps">
    <div class="bar"><span id="pbar"></span></div>
  </div>

  <div id="app"></div>

  <aside class="side-radar" aria-hidden="true">
    <div class="card">
      <h3 id="miniTitle">Votre profil en direct</h3>
      <canvas id="miniRadar" width="760" height="620" aria-label="Radar en cours"></canvas>
    </div>
  </aside>
</div>

<script>
// ================= langue =================
let LANG = 'en';
function L(o){ return o[LANG]; }

// ================= données (bilingue) =================
const AXES = [
  { key:"Vision",
    label:{fr:"Vision", en:"Vision"},
    sub:{fr:"La stratégie : les ambitions, les priorités, le portage par la direction.",
         en:"Strategy: ambitions, priorities, leadership sponsorship."},
    questions:[
    {n:1, t:{fr:"Où en êtes-vous sur une ambition IA appliquée à vos négociations ?",
             en:"Where do you stand on an AI ambition applied to your negotiations?"},
      o:{fr:["Aucune réflexion formalisée","Des idées et discussions, mais rien de cadré","Une ambition définie, en partie déployée","Une vision claire, portée par la direction et reliée à nos priorités commerciales"],
         en:["No formal thinking yet","Ideas and discussions, but nothing framed","A defined ambition, partly deployed","A clear vision, led by management and tied to our commercial priorities"]}},
    {n:2, t:{fr:"Vos priorités IA (par quoi commencer) en négo sont…",
             en:"Your AI priorities (where to start) in negotiation are…"},
      o:{fr:["Non définies","Floues, chacun teste dans son coin","Identifiées mais pas priorisées","Clairement priorisées et séquencées"],
         en:["Undefined","Vague, everyone experiments on their own","Identified but not prioritized","Clearly prioritized and sequenced"]}},
    {n:3, t:{fr:"Les gains potentiels de l'IA appliquée à vos négociations sont :",
             en:"The potential gains of AI applied to your negotiations are:"},
      o:{fr:["Difficiles à évaluer aujourd'hui","Existants mais probablement limités","Significatifs, sans être encore chiffrés","Très importants, déjà partiellement identifiés"],
         en:["Hard to assess today","Real but probably limited","Significant, though not yet quantified","Very high, already partly identified"]}},
    {n:5, t:{fr:"Un budget est-il dédié à l'IA pour la négo cette année ?",
             en:"Is there a budget dedicated to AI for negotiation this year?"},
      o:{fr:["Aucun budget identifié","Budget de test / expérimentation","Budget défini, en cours de déploiement","Budget récurrent inscrit dans le plan pluriannuel"],
         en:["No budget identified","Test / pilot budget","Defined budget, being deployed","Recurring budget in the multi-year plan"]}},
  ]},
  { key:"Gouvernance",
    label:{fr:"Gouvernance", en:"Governance"},
    sub:{fr:"Les règles du jeu : qui décide, ce qui est autorisé, protection de l'information sensible.",
         en:"Rules of the game: who decides, what's allowed, protecting sensitive information."},
    questions:[
    {n:6, t:{fr:"Un cadre d'usage de l'IA est-il en place (charte, confidentialité) ?",
             en:"Is an AI usage framework in place (charter, confidentiality)?"},
      o:{fr:["Non","En cours de réflexion","Charte diffusée, mais appliquée de façon inégale","Cadre formel appliqué et suivi"],
         en:["No","Under consideration","Charter shared, but unevenly applied","Formal framework applied and monitored"]}},
    {n:7, t:{fr:"Qui porte le sujet IA en interne aujourd'hui ?",
             en:"Who owns the AI topic internally today?"},
      o:{fr:["Personne n'est clairement désigné","Un référent informel","Un responsable dédié","Une équipe ou un comité dédié"],
         en:["No one is clearly designated","An informal point person","A dedicated owner","A dedicated team or committee"]}},
    {n:8, t:{fr:"Vos données sensibles (prix, conditions, marges) sont…",
             en:"Your sensitive data (prices, terms, margins) are…"},
      o:{fr:["Utilisées librement dans des outils d'IA publics","Manipulées avec prudence, mais sans règle","Encadrées par des règles, avec un contrôle partiel","Protégées et jamais exposées à des outils publics"],
         en:["Used freely in public AI tools","Handled cautiously, but with no rule","Governed by rules, with partial control","Protected and never exposed to public tools"]}},
    {n:9, t:{fr:"Qui tranche sur ce qu'un négociateur a le droit de saisir dans un outil d'IA ?",
             en:"Who decides what a negotiator may enter into an AI tool?"},
      o:{fr:["Personne, chacun fait comme il le sent","Une consigne orale, non écrite","Une règle écrite, connue de la plupart","Une règle écrite, contrôlée et appliquée"],
         en:["No one, everyone does as they see fit","A verbal, unwritten guideline","A written rule, known to most","A written rule, monitored and enforced"]}},
  ]},
  { key:"Data",
    label:{fr:"Data", en:"Data"},
    sub:{fr:"La matière première, le carburant de l'IA : disponibilité, fiabilité et centralisation.",
         en:"The raw material, AI's fuel: availability, reliability and centralization."},
    questions:[
    {n:10, t:{fr:"L'accès à vos données nécessaires à la négo est…",
              en:"Access to the data you need for negotiation is…"},
      o:{fr:["Difficile, dispersé, chronophage","Possible, mais au prix de travail manuel","Correct pour l'essentiel","Centralisé et disponible à la demande"],
         en:["Hard, scattered, time-consuming","Possible, but requires manual work","Fine for the most part","Centralized and available on demand"]}},
    {n:11, t:{fr:"La qualité et la fraîcheur de ces données sont…",
              en:"The quality and freshness of this data are…"},
      o:{fr:["Peu fiables ou obsolètes","Variables selon les sources","Globalement fiables","Fiables, à jour et gouvernées"],
         en:["Unreliable or outdated","Variable depending on the source","Generally reliable","Reliable, up to date and governed"]}},
    {n:12, t:{fr:"Relier une décision de négo à son impact réel (marge) est…",
              en:"Linking a negotiation decision to its real impact (margin) is…"},
      o:{fr:["Impossible aujourd'hui","Long et approximatif, en manuel","Possible sur certains périmètres","Rapide et précis"],
         en:["Impossible today","Slow and rough, done manually","Possible on some scopes","Fast and precise"]}},
  ]},
  { key:"Team",
    label:{fr:"Équipe", en:"Team"},
    sub:{fr:"Vos équipes ont-elles été formées à l'IA ? Sont-elles motivées à l'utiliser ?",
         en:"Have your teams been trained in AI? Are they motivated to use it?"},
    questions:[
    {n:13, t:{fr:"Vos équipes ont-elles été formées à l'usage de l'IA ?",
              en:"Have your teams been trained to use AI?"},
      o:{fr:["Non, aucune formation à ce jour","Formations ponctuelles, à l'initiative de quelques-uns","Programme de formation en cours de déploiement","Formation structurée, avec accompagnement régulier"],
         en:["No, no training to date","Occasional training, driven by a few individuals","A training program being rolled out","Structured training, with regular coaching"]}},
    {n:14, t:{fr:"La maîtrise des outils d'IA par vos équipes est…",
              en:"Your teams' mastery of AI tools is…"},
      o:{fr:["Nulle","Limitée à quelques autodidactes","Présente dans une partie des équipes","Largement diffusée"],
         en:["Nonexistent","Limited to a few self-taught users","Present in part of the teams","Widely spread"]}},
    {n:15, t:{fr:"L'état d'esprit des équipes face à l'IA est plutôt…",
              en:"Your teams' mindset toward AI is more…"},
      o:{fr:["Réfractaire ou méfiant","Attentiste","Ouvert et curieux","Moteur et demandeur"],
         en:["Resistant or wary","Wait-and-see","Open and curious","Driving and eager"]}},
  ]},
  { key:"Techno",
    label:{fr:"Technologie", en:"Technology"},
    sub:{fr:"La tuyauterie : les outils pour faire tourner l'IA et les connecter à vos systèmes.",
         en:"The plumbing: tools to run AI and connect it to your systems."},
    questions:[
    {n:17, t:{fr:"Accès à des outils d'IA de niveau entreprise, dans un cadre sécurisé ?",
              en:"Access to enterprise-grade AI tools, within a secure framework?"},
      o:{fr:["Aucun accès, ou seulement des outils grand public","Accès individuel à des outils publics, sans cadre","Licences entreprise sécurisées pour certaines équipes","Environnement IA sécurisé, déployé et encadré"],
         en:["No access, or only consumer tools","Individual access to public tools, no framework","Secure enterprise licenses for some teams","A secure AI environment, deployed and governed"]}},
    {n:18, t:{fr:"Vos systèmes informatiques (âge, cloud, capacité à évoluer) ?",
              en:"Your IT systems (age, cloud, ability to evolve)?"},
      o:{fr:["Anciens, peu ou pas de cloud, difficiles à faire évoluer","Mélange d'ancien et de récent, modernisation en cours","Majoritairement dans le cloud et à jour","Socle cloud moderne, prêt pour de nouvelles briques d'IA"],
         en:["Old, little or no cloud, hard to evolve","A mix of old and new, modernization underway","Mostly in the cloud and up to date","A modern cloud foundation, ready for new AI building blocks"]}},
    {n:19, t:{fr:"Un outil d'IA pourrait-il se connecter à vos systèmes (CRM, ERP, contrats/prix) ?",
              en:"Could an AI tool connect to your systems (CRM, ERP, contracts/prices)?"},
      o:{fr:["Non, aucune connexion possible","Uniquement par copier-coller / ressaisie","Connexions partielles, certains systèmes seulement","Intégration fluide (API) : lecture et écriture"],
         en:["No, no connection possible","Only via copy-paste / re-keying","Partial connections, some systems only","Seamless integration (API): read and write"]}},
    {n:20, t:{fr:"Si une solution IA sur mesure avait du sens, sauriez-vous à qui la confier ?",
              en:"If a custom AI solution made sense, would you know who to entrust it to?"},
      o:{fr:["Non, aucune capacité interne ni partenaire","Bricolage individuel, sans support de l'IT","Une équipe IT/data ou un partenaire au cas par cas","Capacité établie pour livrer et maintenir dans la durée"],
         en:["No, no internal capacity or partner","Individual tinkering, no IT support","An IT/data team or a partner, case by case","An established capability to deliver and maintain over time"]}},
  ]},
  { key:"Adoption",
    label:{fr:"Adoption", en:"Adoption"},
    sub:{fr:"Cas d'usage : l'IA est-elle utilisée au quotidien ?",
         en:"Use cases: is AI used day-to-day?"},
    questions:[
    {n:21, t:{fr:"Vos équipes de négo utilisent-elles déjà l'IA ?",
              en:"Do your negotiation teams already use AI?"},
      o:{fr:["Pas du tout","Quelques négociateurs à titre individuel","Usage encouragé et outillé pour toute l'équipe","Intégré au processus de négo officiel"],
         en:["Not at all","A few negotiators individually","Use encouraged and equipped for the whole team","Built into the official negotiation process"]}},
    {n:22, t:{fr:"Comment sont exploités les échanges pendant une négociation ?",
              en:"How are exchanges during a negotiation used?"},
      o:{fr:["Notes manuelles + compte-rendu à la main","Enregistrement audio + compte-rendu manuel","Compte-rendu automatisé depuis l'audio (IA)","Workflow automatisé avec prompts spécifiques (IA)"],
         en:["Manual notes + handwritten summary","Audio recording + manual summary","Automated summary from audio (AI)","Automated workflow with specific prompts (AI)"]}},
    {n:23, t:{fr:"Comment organisez-vous la veille ?",
              en:"How do you organize market/competitive watch?"},
      o:{fr:["Aucune veille organisée","Veille ponctuelle, à la main","Veille structurée avec outils dédiés","Veille automatisée avec IA (synthèses, signaux faibles)"],
         en:["No organized watch","Occasional watch, done by hand","Structured watch with dedicated tools","Automated watch with AI (summaries, weak signals)"]}},
    {n:24, t:{fr:"Disposez-vous d'outils de simulation pour préparer vos négos ?",
              en:"Do you have simulation tools to prepare your negotiations?"},

// ================= construction des écrans =================
const app = document.getElementById('app');

function buildScreens(){
  const U = UI[LANG];
  app.innerHTML = '';

  // --- écran 0 : intro ---
  const intro = document.createElement('section');
  intro.className='screen panel intro'; intro.dataset.i='0';
  intro.innerHTML = `
    <div class="langbar">
      <button data-lang="en"${LANG==='en'?' class="on"':''}>EN</button>
      <button data-lang="fr"${LANG==='fr'?' class="on"':''}>FR</button>
    </div>
    <img class="hero-visual" src="${HERO_SRC}" alt="">
    ${U.introP.map(p=>`<p>${p}</p>`).join('')}
    <ul>${U.introAxes.map(li=>`<li>${li}</li>`).join('')}</ul>
    ${U.introEnd.map(p=>`<p>${p}</p>`).join('')}
    <p class="conf">${U.conf}</p>
  `;
  intro.appendChild(nav(0));
  app.appendChild(intro);
  intro.querySelectorAll('button[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

  // --- écrans 1..6 : axes ---
  AXES.forEach((ax,ai)=>{
    const s=document.createElement('section'); s.className='screen panel'; s.dataset.i=String(ai+1);
    const h=document.createElement('h2'); h.className='axe-title'; h.textContent=`${ai+1}. ${L(ax.label)}`;
    const sub=document.createElement('p'); sub.className='axe-sub'; sub.textContent=L(ax.sub);
    s.appendChild(h); s.appendChild(sub);
    ax.questions.forEach(q=>{
      const qd=document.createElement('div'); qd.className='q';
      qd.innerHTML=`<p class="qt"><span class="num">${U.qPrefix}${q.n}.</span> ${L(q.t)}</p>`;
      const opts=document.createElement('div'); opts.className='opts';
      L(q.o).forEach((txt,k)=>{
        const v=k+1; const lab=document.createElement('label'); lab.className='opt';
        lab.innerHTML=`<input type="radio" name="q${q.n}" value="${v}"><span>${txt}</span>`;
        const inp=lab.querySelector('input');
        if(answers[q.n]===v) inp.checked=true;
        inp.addEventListener('change',()=>{answers[q.n]=v; markChecked(); updateMini();});
        opts.appendChild(lab);
      });
      qd.appendChild(opts); s.appendChild(qd);
    });
    s.appendChild(nav(ai+1));
    app.appendChild(s);
  });

  // --- écran 7 : résultat ---
  const res=document.createElement('section'); res.className='screen panel'; res.dataset.i=String(LAST);
  const ex = U.explains.map((e,i)=>`
    <details class="xp"${i===0?' open':''}><summary><span class="n">${i+1}.</span> ${e.sum}<span class="axscore"><span class="lab">${U.yourScore}</span><span id="ax${i}">—</span></span></summary><div class="xpbody">
      <p><span class="k">${U.kDef}</span> ${e.def}</p>
      <p><span class="k">${U.kEx}</span> ${e.ex}</p>
      <p><span class="k">${U.kCrit}</span> ${e.crit}</p>
    </div></details>`).join('');
  const fv=k=>escAttr(formData[k]||'');
  res.innerHTML=`
    <h2 class="result-title">${U.resultTitle} : <span id="gscore">—</span> / 5</h2>
    <p class="result-level" id="glevel"></p>
    <div class="diagram-card"><canvas id="radar" width="2000" height="667" aria-label="${U.diagramTitle}"></canvas></div>
    <h3 class="explain-h" style="margin:0 0 10px;font-size:18px;color:var(--navy);text-align:center">${U.summaryH}</h3>
    <div class="sumgrid" id="sumgrid"></div>
    <div class="explain">
      <h3>${U.axesHeading}</h3>
      ${ex}
    </div>
    <div class="report-form" id="reportForm">
      <h3>${U.formTitle}</h3>
      <p class="sub">${U.formSub}</p>
      <div class="fgrid">
        <label>${U.fFirst}<input type="text" id="fFirst" autocomplete="given-name" value="${fv('fFirst')}"></label>
        <label>${U.fLast}<input type="text" id="fLast" autocomplete="family-name" value="${fv('fLast')}"></label>
        <label>${U.fEmail}<input type="email" id="fEmail" autocomplete="email" value="${fv('fEmail')}"></label>
        <label>${U.fCompany}<input type="text" id="fCompany" autocomplete="organization" value="${fv('fCompany')}"></label>
      </div>
      <div class="factions">
        <button class="primary" id="pdfBtn">${U.fBtn}</button>
        <span class="fmsg" id="fmsg" role="status"></span>
      </div>
    </div>
  `;
  res.appendChild(nav(LAST));
  app.appendChild(res);

  bindRadarCanvas();
  ['fFirst','fLast','fEmail','fCompany'].forEach(id=>{const el=document.getElementById(id); el.addEventListener('input',()=>{formData[id]=el.value; el.classList.remove('err');});});
  document.getElementById('pdfBtn').addEventListener('click',onPdf);
  document.querySelectorAll('button[data-fill]').forEach(b=>b.addEventListener('click',()=>fill(b.dataset.fill)));
}

function setLang(lang){
  if(lang===LANG) return;
  LANG = lang;
  applyLangChrome();
  buildScreens();
  markChecked();
  go(cur);
}
function applyLangChrome(){
  const U = UI[LANG];
  document.documentElement.lang = U.htmlLang;
  document.getElementById('hTitle').textContent = U.hTitle;
  document.getElementById('miniTitle').textContent = U.miniTitle;
}

// ================= navigation =================
function nav(i){
  const U = UI[LANG];
  const n=document.createElement('div'); n.className='nav';
  const back=document.createElement('button'); back.className='back'; back.innerHTML=U.back;
  const next=document.createElement('button'); next.className='primary';
  if(i===0){ back.disabled=true; next.innerHTML=U.start; }
  else if(i===NAX){ next.innerHTML=U.toResult; }
  else if(i===LAST){ next.innerHTML=U.restart; }
  else{ next.innerHTML=U.next; }
  back.addEventListener('click',()=>go(i-1));
  next.addEventListener('click',()=>{ if(i===LAST){reset();} else {go(i+1);} });
  const page=document.createElement('div'); page.className='pageno';
  page.textContent = (i>=1 && i<=NAX) ? `${U.page} ${i} / ${NAX}` : '';
  n.appendChild(back); n.appendChild(page); n.appendChild(next);
  return n;
}
let cur=0;
function go(i){
  i=Math.max(0,Math.min(LAST,i));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', +s.dataset.i===i));
  cur=i;
  updateProgress();
  const filling = (i>=1 && i<=NAX);
  document.querySelector('.wrap').classList.toggle('filling', filling);
  document.querySelector('.wrap').classList.toggle('result', i===LAST);
  document.querySelector('.side-radar').setAttribute('aria-hidden', filling?'false':'true');
  if(filling) updateMini();
  if(i===LAST) compute();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProgress(){
  const bar=document.getElementById('pbar');
  if(cur===0){ bar.style.width='0%'; }
  else if(cur===LAST){ bar.style.width='100%'; }
  else{ bar.style.width=(cur/NAX*100).toFixed(0)+'%'; }
}
function reset(){ for(const k in answers) delete answers[k]; document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false); markChecked(); go(0); }

function markChecked(){
  document.querySelectorAll('label.opt').forEach(l=>{const inp=l.querySelector('input'); l.classList.toggle('checked', inp.checked);});
}

// ================= scoring =================
function axisScore(ax){const v=ax.questions.map(q=>answers[q.n]).filter(x=>x); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null;}
function compute(){
  const dec = LANG==='fr' ? ',' : '.';
  const fmt=v=>v==null?'—':v.toFixed(2).replace('.',dec);
  const scores=AXES.map(ax=>{const s=axisScore(ax); return {s5:s==null?null:s*5/4};});
  scores.forEach((x,i)=>{const el=document.getElementById('ax'+i); if(el) el.textContent=fmt(x.s5);});
  const done=scores.filter(x=>x.s5!=null);
  const g=done.length? done.reduce((a,b)=>a+b.s5,0)/done.length : null;
  const gs=document.getElementById('gscore'); if(gs) gs.textContent=fmt(g);
  lastScores=scores.map(x=>x.s5); lastGlobal=g;

const WEB = {
  W:3024, H:1008, c:[1512,453],
  // pour chaque axe (sens horaire depuis le haut) : anneaux 1 → 5 de la toile
  spokes:[
    [[1512,406],[1511,344],[1511,276],[1512,206],[1512,126]],
    [[1552,430],[1618,394],[1685,355],[1759,310],[1856,255]],
    [[1552,478],[1618,514],[1685,550],[1759,592],[1855,641]],
    [[1511,499],[1512,565],[1511,635],[1511,711],[1512,800]],
    [[1469,478],[1404,514],[1338,550],[1264,591],[1169,642]],
    [[1472,431],[1405,393],[1338,356],[1264,311],[1168,255]]
  ]
};
const CROP_FULL = {x:0, y:0, w:3024, h:1008};        // héros + toile + araignée
const CROP_WEB  = {x:840, y:30, w:1344, h:870};      // toile seule (mobile, radar latéral)
const DIAG = {navy:'#1B2A4A', gold:'#C9A227', ink:'#2B2F36', line:'#E2E5EA'};

function lerp(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
function webPoint(i,v){
  const sp=WEB.spokes[i]; v=Math.max(0,Math.min(5,v));
  if(v<=1) return lerp(WEB.c, sp[0], v);
  const k=Math.min(4,Math.floor(v)); if(k>=5||v>=5) return sp[4];
  return lerp(sp[k-1], sp[k], v-k);
}
function fmtScore(v){ const dec = LANG==='fr' ? ',' : '.'; return v==null?'—':v.toFixed(2).replace('.',dec); }
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* Dessine la toile + le profil de l'utilisateur.
   crop : zone de l'image ; outW : largeur interne du canvas ; font : taille des étiquettes en px de l'image d'origine */
function drawWeb(canvas, vals, crop, outW, font){
  const S = outW / crop.w, W = Math.round(crop.w*S), H = Math.round(crop.h*S);
  if(canvas.width!==W) canvas.width=W;
  if(canvas.height!==H) canvas.height=H;
  const c = canvas.getContext('2d');
  c.clearRect(0,0,W,H); c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  const P = ([x,y]) => [(x-crop.x)*S, (y-crop.y)*S];
  if(WEB_IMG.complete && WEB_IMG.naturalWidth){
    const k = WEB_IMG.naturalWidth / WEB.W;
    c.drawImage(WEB_IMG, crop.x*k, crop.y*k, crop.w*k, crop.h*k, 0, 0, W, H);
  }
  const N = AXES.length;
  const idx = []; for(let i=0;i<N;i++) if(vals[i]!=null) idx.push(i);

  // forme du profil
  if(idx.length>=2){
    c.beginPath();
    idx.forEach((i,k)=>{ const [x,y]=P(webPoint(i,vals[i])); k?c.lineTo(x,y):c.moveTo(x,y); });
    if(idx.length>=3){ c.closePath(); c.fillStyle='rgba(27,42,74,.28)'; c.fill(); }
    c.strokeStyle=DIAG.navy; c.lineWidth=Math.max(2, 7*S); c.lineJoin='round'; c.stroke();
  }
  idx.forEach(i=>{ const [x,y]=P(webPoint(i,vals[i]));
    c.beginPath(); c.arc(x,y,Math.max(4,11*S),0,Math.PI*2); c.fillStyle=DIAG.gold; c.fill();
    c.lineWidth=Math.max(1.5,4*S); c.strokeStyle='#fff'; c.stroke(); });

  // étiquettes : nom de l'axe + score, en pastille près de chaque extrémité
  const fs = font*S, pad = 0.45*fs, gap = 44;
  c.textBaseline='middle';
  for(let i=0;i<N;i++){
    const tip = WEB.spokes[i][4], dx = tip[0]-WEB.c[0], dy = tip[1]-WEB.c[1], len = Math.hypot(dx,dy);
    const ux = dx/len, uy = dy/len;
    const [ax,ay] = P([tip[0]+ux*gap, tip[1]+uy*gap]);
    const l1 = (i+1)+'. '+L(AXES[i].label), l2 = fmtScore(vals[i]) + ' / 5';
    c.font = `700 ${fs}px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif`; const w1 = c.measureText(l1).width;
    c.font = `700 ${fs*0.85}px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif`; const w2 = c.measureText(l2).width;
    const bw = Math.max(w1,w2) + pad*2, bh = fs*2.05 + pad*1.2;
    let bx = Math.abs(ux)<0.3 ? ax-bw/2 : (ux>0 ? ax : ax-bw);
    let by = Math.abs(uy)<0.6 ? ay-bh/2 : (uy>0 ? ay : ay-bh);
    bx = Math.max(4, Math.min(W-bw-4, bx)); by = Math.max(4, Math.min(H-bh-4, by));
    roundRect(c,bx,by,bw,bh,Math.min(10,fs*0.4));
    c.fillStyle='rgba(255,255,255,.94)'; c.fill(); c.lineWidth=Math.max(1,2*S); c.strokeStyle=DIAG.line; c.stroke();
    c.textAlign='center';
    c.fillStyle=DIAG.navy; c.font=`700 ${fs}px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif`;
    c.fillText(l1, bx+bw/2, by+pad*0.6+fs*0.55);
    c.fillStyle=DIAG.gold; c.font=`700 ${fs*0.85}px -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif`;
    c.fillText(l2, bx+bw/2, by+pad*0.6+fs*1.55);
  }
}

let cv;
function bindRadarCanvas(){ cv=document.getElementById('radar'); }
function cssvar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function drawRadar(vals){
  if(!cv) return;
  const narrow = (cv.clientWidth || window.innerWidth) < 700;
  if(narrow) drawWeb(cv, vals, CROP_WEB, 900, 44);
  else drawWeb(cv, vals, CROP_FULL, 2000, 40);
}

const mcv=document.getElementById('miniRadar');
function miniScores(){ return AXES.map(ax=>{const s=axisScore(ax); return s==null?null:s*5/4;}); }
function updateMini(){ drawWeb(mcv, miniScores(), CROP_WEB, 760, 50); }

// ================= synthèse =================
function levelOf(v){ return v<2?0 : v<3?1 : v<4?2 : 3; }
function escAttr(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function analysis(){
  const U=UI[LANG];
  const rows=AXES.map((ax,i)=>({i, name:L(ax.label), v:lastScores[i]}));
  const done=rows.filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
  const strengths=done.slice(0,2), priorities=done.length>2 ? done.slice(-2).reverse() : [];
  let balance='';
  if(done.length>=2){
    const hi=done[0], lo=done[done.length-1];
    balance = (hi.v-lo.v>=1.5) ? U.gapNote(hi.name, lo.name) : U.evenNote;
  }
  return {rows, done, strengths, priorities, balance, incomplete: done.length<AXES.length};
}
function renderSummary(){
  const box=document.getElementById('sumgrid'); if(!box) return;
  const U=UI[LANG], A=analysis();
  if(!A.done.length){ box.innerHTML=''; return; }
  const li=r=>`<li><b>${r.i+1}. ${r.name}</b> — ${fmtScore(r.v)} / 5 · ${U.levels[levelOf(r.v)]}</li>`;
  box.innerHTML=`
    <div class="sumcard full">
      <p>${lastGlobal==null?'':U.levelDesc[levelOf(lastGlobal)]}</p>
      ${A.balance?`<p>${A.balance}</p>`:''}
      ${A.incomplete?`<p style="color:var(--muted)">${U.incomplete}</p>`:''}
    </div>
    <div class="sumcard"><h4>${U.strengthsH}</h4><ul>${A.strengths.map(li).join('')}</ul></div>
    ${A.priorities.length?`<div class="sumcard"><h4>${U.prioritiesH}</h4><ul>${A.priorities.map(li).join('')}</ul></div>`:''}
  `;
}

// ================= formulaire + export PDF =================
function onPdf(){
  const U=UI[LANG], msg=document.getElementById('fmsg'), btn=document.getElementById('pdfBtn');
  const ids=['fFirst','fLast','fEmail','fCompany'];
  const v={}; let missing=false;
  ids.forEach(id=>{ const el=document.getElementById(id); v[id]=el.value.trim(); formData[id]=el.value; el.classList.toggle('err', !v[id]); if(!v[id]) missing=true; });
  msg.className='fmsg';
  if(missing){ msg.textContent=U.fErrReq; msg.classList.add('err'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.fEmail)){ document.getElementById('fEmail').classList.add('err'); msg.textContent=U.fErrEmail; msg.classList.add('err'); return; }
  if(!(window.jspdf && window.jspdf.jsPDF)){ msg.textContent=U.fErrLib; msg.classList.add('err'); return; }
  btn.disabled=true; msg.textContent=U.fBusy;
  setTimeout(()=>{
    try{
      buildPdf({first:v.fFirst, last:v.fLast, email:v.fEmail, company:v.fCompany});
      msg.textContent=U.fOk; msg.classList.add('ok');
      logToSheet(v);
    }catch(e){ console.error(e); msg.textContent=U.fErrLib; msg.classList.add('err'); }
    btn.disabled=false;
  },30);
}
function logToSheet(v){
  if(!SHEET_URL) return;
  const r2=x=>x==null?'':Math.round(x*100)/100;
  const payload={ firstName:v.fFirst, lastName:v.fLast, email:v.fEmail, company:v.fCompany, lang:LANG,
    global:r2(lastGlobal), level: lastGlobal==null?'':UI.en.levels[levelOf(lastGlobal)], scores:{}, answers:{} };
  AXES.forEach((ax,i)=>{ payload.scores[ax.key]=r2(lastScores[i]); ax.questions.forEach(q=>{ payload.answers['Q'+q.n]=answers[q.n]||''; }); });
  fetch(SHEET_URL,{method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)}).catch(()=>{});
}
function buildPdf(p){
  const U=UI[LANG], A=analysis();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const PW=210, PH=297, M=16, CW=PW-2*M;
  const NAVY=[27,42,74], GOLD=[201,162,39], INK=[43,47,54], MUTED=[107,114,128], LINE=[226,229,234], SOFT=[237,239,244];
  let y=0;
  const T=(t)=>String(t).replace(/[\u2009\u202F]/g,' ');
  const setC=(c)=>doc.setTextColor(c[0],c[1],c[2]);
  const newPage=()=>{ doc.addPage(); y=M; };
  const ensure=(h)=>{ if(y+h > PH-18) newPage(); };
  const para=(text,size=10,color=INK,style='normal',lh=1.45,x=M,w=CW)=>{
    doc.setFont('helvetica',style); doc.setFontSize(size); setC(color);
    const lines=doc.splitTextToSize(T(text), w), step=size*0.3528*lh;
    lines.forEach(l=>{ ensure(step); doc.text(l, x, y+step*0.75); y+=step; });
  };
  const h2=(text)=>{
    ensure(16); y+=3;
    doc.setFillColor(...GOLD); doc.rect(M, y+1, 3, 6, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(14); setC(NAVY); doc.text(T(text), M+6, y+6);
    y+=11;
  };

  // --- en-tête ---
  doc.setFillColor(...NAVY); doc.rect(0,0,PW,40,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); setC(GOLD); doc.text('WENEGO', M, 13);
  doc.setFontSize(20); doc.setTextColor(255,255,255); doc.text(T(U.pdfTitle), M, 24);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(210,216,228); doc.text(T(U.pdfSub), M, 32);
  y=48;

  // --- participant ---
  const date=new Date().toLocaleDateString(LANG==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'});
  const info=[[U.pdfFor, p.first+' '+p.last],[U.pdfCompany, p.company],[U.pdfEmail, p.email],[U.pdfDate, date]];
  doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, 26, 2, 2, 'F');
  info.forEach((r,k)=>{
    const cx = M+5 + (k%2)*(CW/2), cy = y+9 + Math.floor(k/2)*10;
    doc.setFont('helvetica','bold'); doc.setFontSize(8); setC(MUTED); doc.text(T(r[0]).toUpperCase(), cx, cy-3.2);
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); setC(NAVY);
    doc.text(doc.splitTextToSize(T(r[1]), CW/2-10)[0], cx, cy+1.6);
  });
  y+=33;

  // --- introduction ---
  h2(U.pdfIntroH);
  U.pdfIntro.forEach(t=>{ para(t,10); y+=2; });
  y+=1;
  U.introAxes.forEach(t=>{ para('•  '+t.replace(/<[^>]+>/g,''), 9.5, INK, 'normal', 1.4, M+2, CW-2); });
  y+=2;

  // --- diagramme ---
  h2(U.pdfDiagramH);
  const off=document.createElement('canvas');
  drawWeb(off, lastScores, CROP_FULL, 2400, 52);
  const imgH = CW * off.height / off.width;
  ensure(imgH+22);
  doc.addImage(off.toDataURL('image/jpeg',0.9),'JPEG', M, y, CW, imgH);
  doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.rect(M, y, CW, imgH);
  y+=imgH+4;
  para(U.pdfDiagramNote, 8.5, MUTED, 'italic');
  y+=3;

  // --- score global ---
  ensure(24);
  doc.setFillColor(...NAVY); doc.roundedRect(M, y, CW, 20, 2, 2, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(210,216,228); doc.text(T(U.resultTitle).toUpperCase(), M+6, y+8);
  doc.setFontSize(18); setC(GOLD); doc.text(fmtScore(lastGlobal)+' / 5', M+6, y+16);
  if(lastGlobal!=null){
    doc.setFontSize(9); doc.setTextColor(210,216,228); doc.text(T(U.levelLbl).toUpperCase(), M+CW-6, y+8, {align:'right'});
    doc.setFontSize(14); doc.setTextColor(255,255,255); doc.text(T(U.levels[levelOf(lastGlobal)]), M+CW-6, y+16, {align:'right'});
  }
  y+=26;

  // --- synthèse ---
  h2(U.summaryH);
  if(lastGlobal!=null){ para(U.levelDesc[levelOf(lastGlobal)], 10); y+=2; }
  if(A.balance){ para(A.balance, 10); y+=2; }
  if(A.incomplete){ para(U.incomplete, 9, MUTED, 'italic'); y+=2; }

  // tableau des scores
  ensure(14+AXES.length*9); y+=6;
  doc.setFont('helvetica','bold'); doc.setFontSize(8); setC(MUTED);
  doc.text(T(U.colAxis).toUpperCase(), M, y); doc.text(T(U.colScore).toUpperCase(), M+64, y); doc.text(T(U.colLevel).toUpperCase(), M+CW, y, {align:'right'});
  y+=2.5; doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, y, M+CW, y); y+=2;
  A.rows.forEach(r=>{
    const rowY=y+5;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); setC(NAVY); doc.text(T((r.i+1)+'. '+r.name), M, rowY);
    const bx=M+64, bw=70;
    doc.setFillColor(...SOFT); doc.roundedRect(bx, rowY-3, bw, 3.6, 1.2, 1.2, 'F');
    if(r.v!=null){ doc.setFillColor(...GOLD); doc.roundedRect(bx, rowY-3, Math.max(2.4, bw*r.v/5), 3.6, 1.2, 1.2, 'F'); }
    setC(INK); doc.setFontSize(9.5); doc.text(fmtScore(r.v), bx+bw+3, rowY);
    doc.setFont('helvetica','normal'); setC(MUTED); doc.text(r.v==null?'—':T(U.levels[levelOf(r.v)]), M+CW, rowY, {align:'right'});
    y+=8; doc.line(M, y, M+CW, y); y+=1;
  });
  y+=4;

  // points forts / axes prioritaires
  const colW=(CW-6)/2;
  const listBox=(title, arr, x, y0)=>{
    let yy=y0+7;
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); setC(MUTED); doc.text(T(title).toUpperCase(), x+4, yy); yy+=6;
    arr.forEach(r=>{
      doc.setFont('helvetica','bold'); doc.setFontSize(10); setC(NAVY); doc.text(T((r.i+1)+'. '+r.name), x+4, yy);
      doc.setFont('helvetica','normal'); setC(INK); doc.text(fmtScore(r.v)+' / 5 · '+T(U.levels[levelOf(r.v)]), x+colW-4, yy, {align:'right'});
      yy+=6;
    });
    return yy;
  };
  if(A.strengths.length){
    const boxH = 12 + Math.max(A.strengths.length, A.priorities.length)*6;
    ensure(boxH+4);
    doc.setDrawColor(...LINE); doc.roundedRect(M, y, colW, boxH, 2, 2, 'S');
    listBox(U.strengthsH, A.strengths, M, y);
    if(A.priorities.length){ doc.roundedRect(M+colW+6, y, colW, boxH, 2, 2, 'S'); listBox(U.prioritiesH, A.priorities, M+colW+6, y); }
    y+=boxH+4;
  }

  // --- explication des axes ---
  y+=4;
  h2(U.pdfAxesH);
  U.explains.forEach((e,i)=>{
    ensure(30);
    doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, 9, 1.5, 1.5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(11); setC(GOLD); doc.text((i+1)+'.', M+3, y+6);
    setC(NAVY); doc.text(T(e.sum), M+9, y+6);
    doc.setFontSize(10); setC(GOLD); doc.text(T(U.yourScore)+(LANG==='fr'?' : ':': ')+fmtScore(lastScores[i])+' / 5', M+CW-3, y+6, {align:'right'});
    y+=12;
    [[U.kDef,e.def],[U.kEx,e.ex],[U.kCrit,e.crit]].forEach(([k,t])=>{
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); setC(NAVY);
      ensure(6); doc.text(T(k), M+2, y+3.3); y+=4.6;
      para(t, 9.5, INK, 'normal', 1.4, M+2, CW-4); y+=1.2;
    });
    y+=3;
  });

  // --- pieds de page ---
  const n=doc.getNumberOfPages();
  for(let k=1;k<=n;k++){
    doc.setPage(k);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, PH-12, PW-M, PH-12);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); setC(MUTED);
    doc.text(T(U.pdfFooter), M, PH-7); doc.text(k+' / '+n, PW-M, PH-7, {align:'right'});
  }

  const safe=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  doc.save(`${U.fileBase}_${safe(p.company)||'Rapport'}_${safe(p.last)}.pdf`);
}

// ================= archetypes (mode test) =================
const PRESETS={ strat:{Vision:4,Gouvernance:3,Data:2,Team:2,Techno:1,Adoption:2}, tech:{Vision:1,Gouvernance:2,Data:4,Team:3,Techno:4,Adoption:3} };
function fill(mode){
  AXES.forEach(ax=>ax.questions.forEach(q=>{
    let v=null;
    if(mode==='1')v=1; else if(mode==='4')v=4; else if(mode==='rand')v=1+Math.floor(Math.random()*4);
    else if(mode==='clear')v=null; else if(PRESETS[mode])v=PRESETS[mode][ax.key];
    if(v==null){delete answers[q.n]; const c=document.querySelector(`input[name=q${q.n}]:checked`); if(c)c.checked=false;}
    else{answers[q.n]=v; const inp=document.querySelector(`input[name=q${q.n}][value="${v}"]`); if(inp)inp.checked=true;}
  }));
  markChecked(); updateMini();
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{ if(cur===LAST) compute(); else if(cur>=1&&cur<=NAX) updateMini(); });
let rsz; window.addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ if(cur===LAST) drawRadar(lastScores); },150); });

applyLangChrome();
buildScreens();
go(0);

</script>
