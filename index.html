<!-- radar V17 : page résultat = score > synthèse > [6 axes | diagramme] ; 2 tailles de police uniquement (--fs-title / --fs-text) -->
<!-- V18 : PDF en 3 pages (intro / 6 axes / recommandations), bloc WeNego en pied de la page résultat, mini-radar avec contour cible + légende, radar compact repliable sur mobile -->
<!-- V19 : sans titre « Synthèse » sur la page résultat, stats footer réordonnées (15 ans / 1500+ / 150+), pas de bouton Accueil en dernière page, bloc WeNego ajouté en pied du rapport PDF -->
<!-- V20 : texte WeNego du pied de page sur 3 lignes (desktop), CTA « échange gratuit de 30 min » + email contact@wenego.fr en pied de la page résultat et du rapport PDF -->
<!-- V17 : dans chaque axe, « Recommandations : » + titre de la reco sur une seule ligne -->
<!-- Logo : lien vers https://www.wenego.fr/?lang=en ou ?lang=fr selon la langue active -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Maturity Diagnostic</title>
<style>
  :root{
    /* === LES 2 SEULES TAILLES DE POLICE === */
    --fs-title:19px;   /* titres */
    --fs-text:15px;    /* tout le reste */

    --navy:#1B2A4A; --gold:#C9A227; --anth:#2B2F36;
    --bg:#F5F6F8; --card:#FFFFFF; --line:#E2E5EA; --muted:#6B7280;
    --navy-soft:rgba(27,42,74,.14);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (max-width:560px){ :root{ --fs-title:17px; --fs-text:14px; } }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --navy:#4C6FB0; --gold:#D9B84A; --anth:#E8EAED;
      --bg:#14161A; --card:#1E2126; --line:#31353C; --muted:#9AA0AA;
      --navy-soft:rgba(76,111,176,.22);
    }
  }
  :root[data-theme="dark"]{
    --navy:#4C6FB0; --gold:#D9B84A; --anth:#E8EAED;
    --bg:#14161A; --card:#1E2126; --line:#31353C; --muted:#9AA0AA;
    --navy-soft:rgba(76,111,176,.22);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--anth);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; font-size:var(--fs-text);
  }
  h1,h2,h3,h4,p,ul{font-size:inherit}
  .wrap{max-width:820px; margin:0 auto; padding:18px 16px 40px}

  /* barre du haut : [ logo | titre | langue ] */
  .topbar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:10px 14px; margin-bottom:14px;
    background:var(--card); border:1px solid var(--line); border-radius:12px}
  .topbar .brand{grid-column:1; justify-self:start; display:inline-flex; align-items:center; border:0; background:none; padding:0; border-radius:4px; cursor:pointer; text-decoration:none}
  .topbar .brand:hover{background:none; opacity:.85}
  .topbar .brand:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  .topbar .brand .logo{height:24px; width:auto; display:block}
  .topbar .brand .logo-txt{font-size:var(--fs-text); font-weight:800; letter-spacing:.5px; color:var(--navy)}
  .topbar .tb-title{grid-column:2; text-align:center; font-size:var(--fs-title); font-weight:800; color:var(--navy); line-height:1.2; white-space:nowrap}
  .topbar .langbar{grid-column:3; justify-self:end}
  @media (max-width:560px){
    .topbar{grid-template-columns:auto 1fr auto; gap:8px; padding:8px 10px}
    .topbar .brand .logo{height:18px}
    .topbar .tb-title{white-space:normal}
  }

  /* bouton Accueil */
  .navfoot{display:flex; justify-content:center; margin-top:14px}
  .homebtn{display:inline-flex; align-items:center; gap:7px; padding:8px 14px}
  .homebtn svg{width:16px; height:16px; flex:none}

  /* radar latéral (desktop, pendant le remplissage) */
  .side-radar{display:none}
  .side-radar .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px}
  .side-radar .mr-head{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin:0 0 8px; padding:0; border:0; background:none; color:var(--navy); font-size:var(--fs-title); font-weight:700; cursor:default}
  .side-radar .mr-head:hover{background:none; color:var(--navy)}
  .side-radar .mr-chev{display:none; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-135deg); transition:transform .15s}
  .side-radar canvas{width:100%; height:auto; display:block}
  .side-radar .mr-legend{margin:8px 0 0; color:var(--muted); text-align:center; line-height:1.4}
  .side-radar .mr-legend .dash{display:inline-block; width:18px; border-top:2px dashed var(--gold); vertical-align:middle; margin-right:6px}
  .side-radar .mr-count{display:block; margin-top:2px; font-weight:700; color:var(--navy)}
  /* mobile / tablette : radar compact en haut, collant et repliable ; questions en pleine largeur */
  @media (max-width:959px){
    .wrap.filling{display:flex; flex-direction:column}
    .wrap.filling .topbar{order:1}
    .wrap.filling .steps{order:2}
    .wrap.filling .side-radar{order:3; display:block; position:sticky; top:env(safe-area-inset-top,0px); z-index:5; margin-bottom:12px}
    .wrap.filling #app{order:4}
    .side-radar .card{padding:10px 12px; box-shadow:0 6px 16px rgba(0,0,0,.08)}
    .side-radar .mr-head{cursor:pointer; margin:0; justify-content:space-between}
    .side-radar .mr-chev{display:block}
    .side-radar .mr-body{margin-top:8px}
    .side-radar canvas{width:auto; max-width:100%; max-height:30vh; margin:0 auto}
    .side-radar.collapsed .mr-body{display:none}
    .side-radar.collapsed .mr-chev{transform:rotate(45deg)}
  }
  @media (min-width:960px){
    .wrap.filling{
      max-width:1120px; display:grid;
      grid-template-columns:minmax(0,1fr) 405px;
      grid-template-areas:"top top" "steps steps" "app radar";
      column-gap:26px; align-items:start;
    }
    .wrap.filling .topbar{grid-area:top}
    .wrap.filling .steps{grid-area:steps}
    .wrap.filling #app{grid-area:app; min-width:0}
    .wrap.filling .side-radar{grid-area:radar; display:block; position:sticky; top:calc(16px + env(safe-area-inset-top,0px))}
  }

  /* progression */
  .steps{display:flex; align-items:center; gap:8px; margin-bottom:14px}
  .wrap.intro .steps{display:none}
  .steps .bar{flex:1; height:6px; background:var(--line); border-radius:20px; overflow:hidden}
  .steps .bar > span{display:block; height:100%; width:0; background:var(--gold); transition:width .25s}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px}
  .langbar{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card)}
  .langbar button{border:0; background:transparent; padding:6px 14px; font-weight:700; color:var(--anth); cursor:pointer; letter-spacing:.3px; border-radius:0}
  .langbar button.on{background:var(--navy); color:#fff}
  .screen{display:none}
  .screen.active{display:block; animation:fade .2s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .screen.active{animation:none} }

  /* intro */
  .hero-visual{display:block; width:100%; height:auto; border-radius:10px; border:1px solid var(--line); background:#fff; margin:0 0 16px}
  .intro p{margin:0 0 12px}
  .intro ul{margin:0 0 10px; padding-left:20px}
  .intro li{margin:0 0 7px}
  .intro li b{color:var(--navy)}
  .intro .conf{font-style:italic; color:var(--muted); margin-bottom:4px}

  h2.axe-title{margin:0 0 2px; font-size:var(--fs-title); color:var(--navy)}
  .axe-sub{margin:0 0 14px; color:var(--muted)}

  .q{padding:12px 0; border-top:1px solid var(--line)}
  .q:first-of-type{border-top:none}
  .q .qt{font-weight:600; margin:0 0 9px}
  .q .qt .num{color:var(--gold); font-weight:700}
  .opts{display:grid; gap:7px}
  label.opt{display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border:1px solid var(--line); border-radius:8px; cursor:pointer; color:var(--anth)}
  label.opt:hover{border-color:var(--navy)}
  label.opt input{margin-top:4px; accent-color:var(--gold)}
  label.opt.checked{border-color:var(--gold); background:var(--navy-soft)}

  /* navigation */
  .nav{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line)}
  .nav .back{justify-self:start}
  .nav .back.hide{visibility:hidden}
  .nav .primary{justify-self:end}
  .nav .pageno{justify-self:center; font-weight:700; color:var(--muted); white-space:nowrap}
  button{font:inherit; font-size:var(--fs-text); cursor:pointer; border-radius:9px; border:1px solid var(--navy); background:var(--card); color:var(--navy); padding:11px 18px; font-weight:700}
  button.primary{background:var(--gold); border-color:var(--gold); color:#1B2A4A}
  button.primary:hover{filter:brightness(.95)}
  button.back:hover, button.homebtn:hover{background:var(--navy); color:#fff}
  button:disabled{opacity:.35; cursor:default; background:var(--card); color:var(--muted); border-color:var(--line)}
  button:focus-visible, summary:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* ===== PAGE RÉSULTAT ===== */
  canvas{width:100%; height:auto; display:block}
  .wrap.result{max-width:1180px}
  .wrap.result .steps{display:none}
  .result-title{margin:4px 0 18px; font-size:var(--fs-title); font-weight:700; color:var(--navy); text-align:center}
  .result-title #gscore{color:var(--gold)}

  /* synthèse (pleine largeur) */
  .sumgrid{display:grid; gap:12px; margin:0 0 26px}
  @media (min-width:720px){ .sumgrid{grid-template-columns:1fr 1fr} }
  .sumcard{border:1px solid var(--line); border-radius:10px; padding:12px 16px}
  .sumcard h4{margin:0 0 8px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted)}
  .sumcard ul{margin:0; padding-left:18px}
  .sumcard li{margin:0 0 4px}
  .sumcard li b{color:var(--navy)}
  .sumcard.full{grid-column:1/-1}
  .sumcard.full p{margin:0 0 6px}
  .sumcard.full p:last-child{margin:0}

  /* 2 colonnes : 6 axes (gauche) | diagramme (droite) */
  .rgrid{display:grid; grid-template-columns:minmax(0,1fr); gap:28px; align-items:start}
  .rgrid h3.rh{margin:0 0 12px; font-size:var(--fs-title); color:var(--navy); text-align:center}
  .diagram-card{background:#fff; border-radius:12px; overflow:hidden}
  @media (min-width:900px){
    .rgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .rright{position:sticky; top:calc(16px + env(safe-area-inset-top,0px))}
  }
  @media (max-width:899px){ .rright{order:-1} }  /* mobile : diagramme en premier */

  /* cartes dépliables (axe + recommandations) */
  .xp{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden}
  .xp>summary{cursor:pointer; list-style:none; padding:12px 14px; font-weight:700; color:var(--navy); background:var(--navy-soft); display:flex; align-items:center; gap:8px}
  .xp>summary::-webkit-details-marker{display:none}
  .xp>summary::after{content:""; flex:none; align-self:center; margin-left:8px; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); transition:transform .15s}
  .xp[open]>summary::after{transform:rotate(-135deg)}
  .xp>summary .n{color:var(--gold)}
  .xp>summary .st{flex:1}
  .xp.prio{border-color:var(--gold)}
  .xp .tag{font-weight:700; color:#1B2A4A; background:var(--gold); border-radius:999px; padding:1px 9px; white-space:nowrap}
  .axscore{margin-left:auto; font-weight:700; color:var(--gold); white-space:nowrap}
  .axscore .lab{color:var(--muted); font-weight:600; margin-right:5px}
  .xp .xpbody{padding:12px 14px}
  .xp .xpbody p{margin:0 0 8px}
  .xp .xpbody ul{margin:0 0 4px; padding-left:18px}
  .xp .xpbody li{margin:0 0 4px}
  .xp .k{color:var(--navy); font-weight:700}
  .xp .recbox{margin-top:10px; padding:10px 12px; border-left:3px solid var(--gold); background:var(--navy-soft); border-radius:0 6px 6px 0}
  /* V17 : « Recommandations : » + titre sur une seule ligne */
  .xp .recbox .lead{margin:0 0 6px; font-weight:700; font-style:italic; color:var(--navy)}
  .xp .recbox .lead .rech{font-style:normal; color:var(--gold)}

  /* bloc WeNego (pied de la page résultat) */
  .about{margin-top:26px; background:#1B2A4A; color:#fff; border-radius:12px; padding:22px 26px}
  .about-grid{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:30px; align-items:center}
  .about-text p{margin:0; line-height:1.6; color:#fff; text-wrap:pretty}
  .about-stats{display:flex; flex-direction:column; gap:8px; padding-left:24px; border-left:1px solid rgba(255,255,255,.15)}
  .about-stat{display:flex; align-items:baseline; gap:10px; line-height:1.6; white-space:nowrap}
  .about-stat .num{font-weight:700; min-width:4.2em; color:#C9A227}
  .about-stat .lbl{opacity:.8}
  .about-cta{justify-self:end}
  .about-cta a{display:inline-block; padding:10px 18px; border-radius:999px; background:#C9A227; color:#1B2A4A; font-weight:700; text-decoration:none; white-space:nowrap}
  .about-cta a:hover{filter:brightness(1.06)}
  .about-cta a:focus-visible{outline:2px solid #fff; outline-offset:3px}
  .about-contact{margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,.15)}
  .about-contact p{margin:0; line-height:1.6; color:#fff}
  .about-contact a{color:#C9A227; font-weight:700; text-decoration:none; white-space:nowrap}
  .about-contact a:hover{text-decoration:underline}
  .about-contact a:focus-visible{outline:2px solid #fff; outline-offset:2px; border-radius:3px}
  @media (max-width:900px){
    .about-grid{grid-template-columns:1fr; gap:22px}
    .about-stats{padding-left:0; border-left:none}
    .about-cta{justify-self:start}
  }

  /* formulaire rapport */
  .report-form{margin-top:30px; border:1px solid var(--gold); border-radius:12px; padding:18px; background:var(--navy-soft)}
  .report-form h3{margin:0 0 4px; font-size:var(--fs-title); color:var(--navy)}
  .report-form .sub{margin:0 0 14px; color:var(--muted)}
  .fgrid{display:grid; gap:12px}
  @media (min-width:640px){ .fgrid{grid-template-columns:1fr 1fr} }
  .fgrid .full{grid-column:1/-1}
  .fgrid label{display:flex; flex-direction:column; gap:5px; font-weight:700; color:var(--anth)}
  .fgrid label .req{color:#C0392B; margin-left:3px}
  .fgrid input, .fgrid textarea{font:inherit; font-size:var(--fs-text); font-weight:400; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--anth); width:100%}
  .fgrid textarea{min-height:96px; resize:vertical; line-height:1.4}
  .fgrid input:focus, .fgrid textarea:focus{outline:2px solid var(--gold); outline-offset:0; border-color:var(--gold)}
  .fgrid input.err{border-color:#C0392B}
  .factions{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px}
  .fmsg{color:var(--navy); flex:1; min-width:220px}
  .fmsg.busy{color:var(--muted)}
  .fmsg.err{color:#C0392B}

  @media (max-width:560px){
    .panel{padding:14px}
    .xp>summary{flex-wrap:wrap; row-gap:4px}
    .xp>summary .st{flex:1 1 60%}
    .factions button{width:100%}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="wrap intro">
  <header class="topbar">
    <a class="brand" id="brandBtn" href="https://www.wenego.fr/?lang=en" aria-label="WeNego"><span class="logo-txt" id="logoSlot">WENEGO</span></a>
    <div class="tb-title" id="phTitle">AI Maturity Diagnostic</div>
    <div class="langbar" id="langbar">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
  </header>

  <div class="steps">
    <div class="bar"><span id="pbar"></span></div>
  </div>

  <div id="app"></div>

  <aside class="side-radar" aria-hidden="true">
    <div class="card">
      <button type="button" class="mr-head" id="mrHead" aria-expanded="true" aria-controls="mrBody"><span id="miniTitle">Your live profile</span><span class="mr-chev" aria-hidden="true"></span></button>
      <div class="mr-body" id="mrBody">
        <canvas id="miniRadar" width="760" height="620" aria-label="Radar"></canvas>
        <p class="mr-legend"><span class="dash" aria-hidden="true"></span><span id="mrLegend"></span><span class="mr-count" id="mrCount"></span></p>
      </div>
    </div>
  </aside>
</div>

function langFromUrl(){
  try{ const l = new URLSearchParams(location.search).get('lang'); return (l==='fr'||l==='en') ? l : null; }
  catch(e){ return null; }
}
let LANG = langFromUrl() || 'en';
function syncUrl(){
  try{ const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u); }

}

function nav(i){
  const U = UI[LANG];
  const n=document.createElement('div'); n.className='nav';
  const back=document.createElement('button'); back.className='back'; back.type='button'; back.innerHTML=U.back;
  const next=document.createElement('button'); next.className='primary'; next.type='button';
  if(i===0){ back.classList.add('hide'); back.tabIndex=-1; back.setAttribute('aria-hidden','true'); next.innerHTML=U.start; }
  else if(i===NAX){ next.innerHTML=U.toResult; }
  else if(i===LAST){ next.innerHTML=U.restart; }
  else{ next.innerHTML=U.next; }
  back.addEventListener('click',()=>go(i-1));
  next.addEventListener('click',()=>{ if(i===LAST){reset();} else {go(i+1);} });
  const page=document.createElement('div'); page.className='pageno';
  page.textContent = (i>=1 && i<=NAX) ? `${U.page} ${i} / ${NAX}` : '';
  n.appendChild(back); n.appendChild(page); n.appendChild(next);
  return n;
}

  const f=document.createElement('div'); f.className='navfoot';

let cur=0;
function go(i){
  i=Math.max(0,Math.min(LAST,i));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', +s.dataset.i===i));
  cur=i;
  updateProgress();
  const filling = (i>=1 && i<=NAX);
  const wrap = document.querySelector('.wrap');
  wrap.classList.toggle('intro', i===0);
  wrap.classList.toggle('filling', filling);
  wrap.classList.toggle('result', i===LAST);
  document.querySelector('.side-radar').setAttribute('aria-hidden', filling?'false':'true');
  if(filling) updateMini();
  if(i===LAST) compute();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ================= scoring =================
function axisScore(ax){const v=ax.questions.map(q=>answers[q.n]).filter(x=>x); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null;}
function compute(){
  const scores=AXES.map(ax=>{const s=axisScore(ax); return s==null?null:s*5/4;});
  const done=scores.filter(x=>x!=null);
  const g=done.length? done.reduce((a,b)=>a+b,0)/done.length : null;
  const gs=document.getElementById('gscore'); if(gs) gs.textContent=fmtScore(g);
  lastScores=scores; lastGlobal=g;
  renderSummary();
  renderAxes();
  drawRadar(lastScores);
}
function fmtScore(v){ const dec = LANG==='fr' ? ',' : '.'; return v==null?'—':v.toFixed(2).replace('.',dec); }

// ================= radar (écran résultat + PDF) =================
const DIAG = {navy:'#1B2A4A', gold:'#C9A227', line:'#E2E5EA'};
const FONT = '-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
function drawRadarChart(canvas, vals, W, H, fs, rf=0.34){
  if(canvas.width!==W) canvas.width=W;
  if(canvas.height!==H) canvas.height=H;
  const c=canvas.getContext('2d');
  c.clearRect(0,0,W,H); c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  const N=AXES.length, cx=W/2, cy=H/2, R=Math.min(W,H)*rf;
  const ang=i=>(-Math.PI/2)+i*2*Math.PI/N, pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  c.lineWidth=fs*0.05; c.strokeStyle=DIAG.line;
  for(let g=1;g<=5;g++){ const r=R*g/5; c.beginPath();
    for(let i=0;i<=N;i++){const[x,y]=pt(i%N,r); i?c.lineTo(x,y):c.moveTo(x,y);}
    c.stroke();
    c.fillStyle=DIAG.gold; c.font=`700 ${fs*0.8}px ${FONT}`; c.textAlign='left'; c.textBaseline='middle';
    c.fillText(String(g), cx+fs*0.2, cy-r); }
  for(let i=0;i<N;i++){const[x,y]=pt(i,R); c.beginPath(); c.moveTo(cx,cy); c.lineTo(x,y); c.stroke();}
  const idx=[]; for(let i=0;i<N;i++) if(vals[i]!=null) idx.push(i);
  if(idx.length>=2){
    c.beginPath(); idx.forEach((i,k)=>{const[x,y]=pt(i,R*vals[i]/5); k?c.lineTo(x,y):c.moveTo(x,y);});
    if(idx.length>=3){ c.closePath(); c.fillStyle='rgba(27,42,74,.22)'; c.fill(); }
    c.strokeStyle=DIAG.gold; c.lineWidth=fs*0.1; c.lineJoin='round'; c.stroke();
  }
  idx.forEach(i=>{const[x,y]=pt(i,R*vals[i]/5); c.beginPath(); c.arc(x,y,fs*0.2,0,Math.PI*2); c.fillStyle=DIAG.gold; c.fill(); c.strokeStyle='#fff'; c.lineWidth=fs*0.06; c.stroke();});
  // libellés : nom de l'axe + score (même taille)
  for(let i=0;i<N;i++){
    const co=Math.cos(ang(i)), si=Math.sin(ang(i)), [lx,ly]=pt(i,R+fs*0.9), lh=fs*1.2;
    c.textAlign = Math.abs(co)<0.3?'center':(co>0?'left':'right');
    let y1,y2;
    if(si<-0.3){ c.textBaseline='bottom'; y2=ly; y1=ly-lh; }
    else if(si>0.3){ c.textBaseline='top'; y1=ly; y2=ly+lh; }
    else { c.textBaseline='middle'; y1=ly-lh/2; y2=ly+lh/2; }
    const name=(i+1)+'. '+L(AXES[i].label), pad=fs*0.3;
    c.font=`700 ${fs}px ${FONT}`; const tw=c.measureText(name).width;
    let x=lx;
    if(c.textAlign==='left' && x+tw>W-pad) x=W-pad-tw;
    if(c.textAlign==='right' && x-tw<pad) x=pad+tw;
    if(c.textAlign==='center') x=Math.max(pad+tw/2, Math.min(W-pad-tw/2, x));
    c.fillStyle=DIAG.navy; c.fillText(name, x, y1);
    c.fillStyle=DIAG.gold; c.fillText(fmtScore(vals[i])+' / 5', x, y2);
  }
}
let cv;
function bindRadarCanvas(){ cv=document.getElementById('radar'); }
function drawRadar(vals){
  if(!cv) return;
  const w = cv.clientWidth || window.innerWidth;
  if(w < 520) drawRadarChart(cv, vals, 1000, 860, 46, 0.27);
  else drawRadarChart(cv, vals, 1100, 860, 32);
}

// ================= mini radar (latéral) =================
function cssvar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function hexA(hex,a){ if(hex.startsWith('#')){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;} return hex; }
const mcv=document.getElementById('miniRadar'), mctx=mcv.getContext('2d');
function miniScores(){ return AXES.map(ax=>{const s=axisScore(ax); return s==null?null:s*5/4;}); }
function updateMini(){
  const vals=miniScores();
  drawMini(vals);
  const el=document.getElementById('mrCount');
  if(el) el.textContent=UI[LANG].miniCount(vals.filter(v=>v!=null).length, AXES.length);
}
function drawMini(vals){
  const W=mcv.width,H=mcv.height,cx=W/2,cy=H/2,R=Math.min(W,H)*0.32;
  const N=AXES.length,navy=cssvar('--navy'),gold=cssvar('--gold'),line=cssvar('--line'),muted=cssvar('--muted');
  mctx.clearRect(0,0,W,H);
  const ang=i=>(-Math.PI/2)+i*2*Math.PI/N, pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
  // grille
  mctx.lineWidth=1; mctx.strokeStyle=line; mctx.setLineDash([]);
  for(let g=1;g<=4;g++){const r=R*g/5; mctx.beginPath();
    for(let i=0;i<=N;i++){const[x,y]=pt(i%N,r); i?mctx.lineTo(x,y):mctx.moveTo(x,y);} mctx.stroke();}
  for(let i=0;i<N;i++){const[x,y]=pt(i,R); mctx.beginPath(); mctx.moveTo(cx,cy); mctx.lineTo(x,y); mctx.stroke();}
  // contour cible « à remplir » (5/5) en pointillé
  mctx.beginPath();
  for(let i=0;i<=N;i++){const[x,y]=pt(i%N,R); i?mctx.lineTo(x,y):mctx.moveTo(x,y);}
  mctx.setLineDash([10,8]); mctx.strokeStyle=hexA(gold,0.9); mctx.lineWidth=2.5; mctx.stroke(); mctx.setLineDash([]);
  // libellés
  mctx.font='700 26px sans-serif';
  for(let i=0;i<N;i++){
    const[lx,ly]=pt(i,R+20);
    mctx.fillStyle = vals[i]==null ? muted : navy;
    mctx.textAlign=Math.abs(Math.cos(ang(i)))<0.3?'center':(Math.cos(ang(i))>0?'left':'right');
    mctx.textBaseline=Math.sin(ang(i))>0.3?'top':(Math.sin(ang(i))<-0.3?'bottom':'middle');
    mctx.fillText((i+1)+'. '+L(AXES[i].label),lx,ly);
  }
  // repères vides sur les axes non commencés
  for(let i=0;i<N;i++) if(vals[i]==null){
    const[x,y]=pt(i,R); mctx.beginPath(); mctx.arc(x,y,6,0,7);
    mctx.fillStyle=cssvar('--card')||'#fff'; mctx.fill(); mctx.strokeStyle=hexA(gold,0.9); mctx.lineWidth=2; mctx.stroke();
  }
  const idx=[]; for(let i=0;i<N;i++) if(vals[i]!=null) idx.push(i);
  if(idx.length>=3){
    mctx.beginPath(); idx.forEach((i,k)=>{const[x,y]=pt(i,R*vals[i]/5); k?mctx.lineTo(x,y):mctx.moveTo(x,y);});
    mctx.closePath(); mctx.fillStyle=hexA(navy,0.22); mctx.fill(); mctx.strokeStyle=gold; mctx.lineWidth=3; mctx.stroke();
  } else {
    // 1 ou 2 axes : rayons depuis le centre pour que le point ne paraisse pas isolé
    mctx.strokeStyle=gold; mctx.lineWidth=3;
    idx.forEach(i=>{const[x,y]=pt(i,R*vals[i]/5); mctx.beginPath(); mctx.moveTo(cx,cy); mctx.lineTo(x,y); mctx.stroke();});
    if(idx.length===2){const[a,b]=idx,[x1,y1]=pt(a,R*vals[a]/5),[x2,y2]=pt(b,R*vals[b]/5);
      mctx.beginPath(); mctx.moveTo(x1,y1); mctx.lineTo(x2,y2); mctx.stroke();}
  }
  idx.forEach(i=>{const[x,y]=pt(i,R*vals[i]/5); mctx.beginPath(); mctx.arc(x,y,6,0,7); mctx.fillStyle=gold; mctx.fill(); mctx.strokeStyle='#fff'; mctx.lineWidth=1.5; mctx.stroke();});
}

// ================= synthèse + axes & recommandations =================
function levelOf(v){ return v<2?0 : v<3?1 : v<4?2 : 3; }
function analysis(){
  const U=UI[LANG];
  const rows=AXES.map((ax,i)=>({i, name:L(ax.label), v:lastScores[i]}));
  const done=rows.filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
  const strengths=done.slice(0,2), priorities=done.length>2 ? done.slice(-2).reverse() : [];
  let balance='';
  if(done.length>=2){
    const hi=done[0], lo=done[done.length-1];
    balance = (hi.v-lo.v>=1.5) ? U.gapNote(hi.name, lo.name) : U.evenNote;
  }
  return {rows, done, strengths, priorities, balance, incomplete: done.length<AXES.length};
}
function renderSummary(){
  const box=document.getElementById('sumgrid'); if(!box) return;
  const U=UI[LANG], A=analysis();
  if(!A.done.length){ box.innerHTML=''; return; }
  const li=r=>`<li><b>${r.i+1}. ${r.name}</b> — ${fmtScore(r.v)} / 5 · ${U.levels[levelOf(r.v)]}</li>`;
  box.innerHTML=`
    <div class="sumcard full">
      <p>${lastGlobal==null?'':U.levelDesc[levelOf(lastGlobal)]}</p>
      ${A.balance?`<p>${A.balance}</p>`:''}
      ${A.incomplete?`<p style="color:var(--muted)">${U.incomplete}</p>`:''}
    </div>
    <div class="sumcard"><h4>${U.strengthsH}</h4><ul>${A.strengths.map(li).join('')}</ul></div>
    ${A.priorities.length?`<div class="sumcard"><h4>${U.prioritiesH}</h4><ul>${A.priorities.map(li).join('')}</ul></div>`:''}
  `;
}
function renderAxes(){
  const box=document.getElementById('axisList'); if(!box) return;
  const U=UI[LANG], R=REPORT[LANG], A=analysis();
  // V17 : « Recommendations: » (EN) / « Recommandations : » (FR)
  const recLabel = R.recH + (LANG==='fr' ? ' :' : ':');
  box.innerHTML = AXES.map((ax,i)=>{
    const e=U.explains[i], r=R.rec[i], prio=A.priorities.some(x=>x.i===i);
    const open = i===0;
    return `<details class="xp${prio?' prio':''}"${open?' open':''}><summary><span class="n">${i+1}.</span><span class="st">${e.sum}</span>
      ${prio?`<span class="tag">${esc(R.prioTag)}</span>`:''}
      <span class="axscore"><span class="lab">${U.yourScore}</span>${fmtScore(lastScores[i])}</span></summary>
      <div class="xpbody">
        <p><span class="k">${U.kDef}</span> ${e.def}</p>
        <p><span class="k">${U.kEx}</span> ${e.ex}</p>
        <p><span class="k">${U.kCrit}</span> ${e.crit}</p>
        <div class="recbox"><p class="lead"><span class="rech">${esc(recLabel)}</span> ${esc(lcFirst(r.s))}</p><ul>${r.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
      </div></details>`;
  }).join('');
}

function onPdf(){
  const U=UI[LANG], msg=document.getElementById('fmsg'), btn=document.getElementById('pdfBtn');
  const ids=['fFirst','fLast','fEmail','fCompany'];
  const v={}; let missing=false;
  ids.forEach(id=>{ const el=document.getElementById(id); v[id]=el.value.trim(); formData[id]=el.value; el.classList.toggle('err', !v[id]); if(!v[id]) missing=true; });
  v.fFeedback = document.getElementById('fFeedback').value.trim();
  msg.className='fmsg';
  if(missing){ msg.textContent=U.fErrReq; msg.classList.add('err'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.fEmail)){ document.getElementById('fEmail').classList.add('err'); msg.textContent=U.fErrEmail; msg.classList.add('err'); return; }
  if(!(window.jspdf && window.jspdf.jsPDF)){ msg.textContent=U.fErrLib; msg.classList.add('err'); return; }
  btn.disabled=true; msg.textContent=U.fBusy; msg.classList.add('busy');
  setTimeout(()=>{
    try{
      buildPdf({first:v.fFirst, last:v.fLast, email:v.fEmail, company:v.fCompany});
      msg.className='fmsg'; msg.textContent=U.fDone;
      logToSheet(v);
    }catch(e){ console.error(e); msg.className='fmsg err'; msg.textContent=U.fErrLib; }
    btn.disabled=false;
  },30);
}
function logToSheet(v){
  if(!SHEET_URL) return;
  const r2=x=>x==null?'':Math.round(x*100)/100;
  const payload={ firstName:v.fFirst, lastName:v.fLast, email:v.fEmail, company:v.fCompany, lang:LANG,
    global:r2(lastGlobal), level: lastGlobal==null?'':UI.en.levels[levelOf(lastGlobal)],
    feedback:v.fFeedback||'', scores:{}, answers:{} };
  AXES.forEach((ax,i)=>{ payload.scores[ax.key]=r2(lastScores[i]); ax.questions.forEach(q=>{ payload.answers['Q'+q.n]=answers[q.n]||''; }); });
  fetch(SHEET_URL,{method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)}).catch(()=>{});
}
// V18 : rapport PDF en 3 pages fixes — 1) intro + diagramme + synthèse, 2) les 6 axes, 3) recommandations + bloc WeNego.
// Si un contenu dépasse (textes plus longs en FR…), le rapport est régénéré avec une typographie légèrement réduite.
function buildPdf(p){
  let out=null, k=1;
  for(let t=0;t<7;t++){ out=renderPdf(p,k); if(!out.overflow) break; k*=0.95; }
  const U=UI[LANG];
  const safe=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  out.doc.save(`${U.fileBase}_${safe(p.company)||'Rapport'}_${safe(p.last)}.pdf`);
}
function renderPdf(p,k){
  const U=UI[LANG], R=REPORT[LANG], A=analysis();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const PW=210, PH=297, M=14, CW=PW-2*M, BOTTOM=PH-13;
  const NAVY=[27,42,74], GOLD=[201,162,39], INK=[43,47,54], MUTED=[107,114,128], LINE=[226,229,234], SOFT=[237,239,244], WHITE=[255,255,255], PALE=[205,211,224];
  let y=0, overflow=false, limit=BOTTOM;
  const T=(t)=>String(t).replace(/[\u2009\u202F]/g,' ').replace(/\u2192/g,'->');
  const setC=(c)=>doc.setTextColor(c[0],c[1],c[2]);
  const chk=()=>{ if(y>limit+0.01) overflow=true; };
  const stepOf=(size,lh)=>size*0.3528*lh;
  const para=(text,size=9,color=INK,style='normal',lh=1.3,x=M,w=CW)=>{
    size*=k; doc.setFont('helvetica',style); doc.setFontSize(size); setC(color);
    const lines=doc.splitTextToSize(T(text), w), st=stepOf(size,lh);
    lines.forEach(l=>{ doc.text(l, x, y+st*0.75); y+=st; }); chk();
  };
  const rich=(segs,size=9,x=M,w=CW,lh=1.28,color=INK)=>{
    size*=k; const st=stepOf(size,lh); doc.setFontSize(size);
    const lines=[]; let line=[], lw=0;
    segs.forEach(([txt,sty])=>{
      const style = sty==='b'?'bold':sty==='i'?'italic':sty==='bi'?'bolditalic':'normal', col = (sty==='b'||sty==='bi')?NAVY:color;
      doc.setFont('helvetica',style);
      T(txt).split(/(\s+)/).forEach(tok=>{
        if(!tok) return;
        if(/^\s+$/.test(tok)){ if(line.length){ const sw=doc.getTextWidth(' '); line.push({t:' ',s:style,c:col,w:sw}); lw+=sw; } return; }
        const tw=doc.getTextWidth(tok);
        if(lw+tw>w && line.length){ while(line.length && line[line.length-1].t===' '){ lw-=line.pop().w; } lines.push(line); line=[]; lw=0; }
        line.push({t:tok,s:style,c:col,w:tw}); lw+=tw;
      });
    });
    if(line.length) lines.push(line);
    lines.forEach(ln=>{ let xx=x; ln.forEach(pc=>{ doc.setFont('helvetica',pc.s); setC(pc.c); doc.text(pc.t, xx, y+st*0.75); xx+=pc.w; }); y+=st; });
    chk();
  };
  const bullet=(text,size=8.6,x=M)=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(size*k); setC(GOLD);
    doc.text('•', x+1.2, y+stepOf(size*k,1.26)*0.75);
    rich([[text]],size,x+4.5,CW-(x-M)-4.5,1.26); y+=0.3*k;
  };
  const h2=(text)=>{
    y+=1.2*k;
    doc.setFillColor(...GOLD); doc.rect(M, y+0.6, 2.2, 4.6*k, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12*k); setC(NAVY); doc.text(T(text), M+5, y+4.6*k);
    y+=7.6*k;
  };
  const pageTop=()=>{ y=M; limit=BOTTOM; };

  // ================= PAGE 1 : intro, diagramme, synthèse =================
  doc.setFillColor(...NAVY); doc.rect(0,0,PW,15,'F');
  if(LOGO_SRC && LOGO_SRC.startsWith('data:image/png')){
    try{ doc.addImage(LOGO_SRC,'PNG', M, 3.6, 33, 33*106/457); }catch(e){ doc.setFont('helvetica','bold'); doc.setFontSize(10); setC(GOLD); doc.text('WENEGO', M, 9.5); }
  } else { doc.setFont('helvetica','bold'); doc.setFontSize(10); setC(GOLD); doc.text('WENEGO', M, 9.5); }
  doc.setFont('helvetica','bold'); doc.setFontSize(13); setC(WHITE); doc.text(T(U.pdfTitle), PW-M, 9.8, {align:'right'});
  y=20;

  // score global
  {
    const lvl = lastGlobal==null ? null : levelOf(lastGlobal);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.8*k);
    const desc = lvl==null ? [] : doc.splitTextToSize(T(U.levelDesc[lvl]), CW-14);
    const ds=stepOf(8.8*k,1.3);
    const bh = 15.5 + desc.length*ds + (desc.length?1.2:0);
    doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, bh, 2, 2, 'F');
    doc.setFillColor(...GOLD); doc.rect(M, y, 2.2, bh, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); setC(MUTED); doc.text(T(U.resultTitle).toUpperCase(), M+7, y+5.5);
    doc.setFontSize(18); setC(GOLD); doc.text(fmtScore(lastGlobal)+' / 5', M+7, y+12.8);
    if(lvl!=null){
      doc.setFontSize(7.5); setC(MUTED); doc.text(T(U.levelLbl).toUpperCase(), M+CW-6, y+5.5, {align:'right'});
      doc.setFontSize(12.5); setC(NAVY); doc.text(T(U.levels[lvl]), M+CW-6, y+12, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(8.8*k); setC(INK);
      desc.forEach((l,j)=>doc.text(l, M+7, y+17.6+j*ds));
    }
    y+=bh+3;
  }

  // participant
  {
    const date=new Date().toLocaleDateString(LANG==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'});
    const info=[[U.pdfFor, p.first+' '+p.last],[U.pdfCompany, p.company],[U.pdfEmail, p.email],[U.pdfDate, date]];
    const cw4=CW/4;
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.roundedRect(M, y, CW, 11, 2, 2, 'S');
    info.forEach((r,i)=>{
      const cx=M+3.5+i*cw4;
      doc.setFont('helvetica','bold'); doc.setFontSize(6.5); setC(MUTED); doc.text(T(r[0]).toUpperCase(), cx, y+4.3);
      doc.setFontSize(8.6); setC(NAVY); doc.text(doc.splitTextToSize(T(r[1]), cw4-5)[0], cx, y+8.6);
    });
    y+=14;
  }

  // introduction
  h2(U.pdfIntroH);
  U.pdfIntro.forEach(t=>{ para(t, 8.8); y+=0.8*k; });
  U.introAxes.forEach(t=>bullet(t.replace(/<[^>]+>/g,''), 8.3));
  y+=1.5*k;

  // diagramme (gauche) + tableau des scores (droite)
  h2(U.summaryH);
  {
    const top=y, imgW=80, cvW=1300, cvH=1120;
    const off=document.createElement('canvas');
    drawRadarChart(off, lastScores, cvW, cvH, 46);
    const imgH=imgW*cvH/cvW;
    doc.addImage(off.toDataURL('image/jpeg',0.9),'JPEG', M, top, imgW, imgH);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.roundedRect(M, top, imgW, imgH, 2, 2, 'S');

    const x0=M+imgW+6, w=CW-imgW-6, bx=x0+31, bw=w-31-34;
    let ty=top+3;
    doc.setFont('helvetica','bold'); doc.setFontSize(7); setC(MUTED);
    doc.text(T(U.colAxis).toUpperCase(), x0, ty); doc.text(T(U.colScore).toUpperCase(), bx, ty); doc.text(T(U.colLevel).toUpperCase(), x0+w, ty, {align:'right'});
    ty+=1.6; doc.setDrawColor(...LINE); doc.line(x0, ty, x0+w, ty); ty+=0.6;
    const rowH=Math.max(6.2, (imgH-12)/AXES.length);
    A.rows.forEach(r=>{
      const ry=ty+rowH/2+1.3;
      doc.setFont('helvetica','bold'); doc.setFontSize(8.6); setC(NAVY); doc.text(T((r.i+1)+'. '+r.name), x0, ry);
      doc.setFillColor(...SOFT); doc.roundedRect(bx, ry-2.6, bw, 3, 1, 1, 'F');
      if(r.v!=null){ doc.setFillColor(...GOLD); doc.roundedRect(bx, ry-2.6, Math.max(2, bw*r.v/5), 3, 1, 1, 'F'); }
      setC(INK); doc.setFontSize(8.4); doc.text(fmtScore(r.v), bx+bw+2, ry);
      doc.setFont('helvetica','normal'); setC(MUTED); doc.text(r.v==null?'—':T(U.levels[levelOf(r.v)]), x0+w, ry, {align:'right'});
      ty+=rowH; doc.line(x0, ty, x0+w, ty);
    });
    y=Math.max(top+imgH, ty)+2.5;
    para(U.pdfDiagramNote, 7.6, MUTED, 'italic', 1.25);
    y+=1.2*k;
  }
  if(A.balance){ para(A.balance, 8.8); y+=0.8*k; }
  if(A.incomplete){ para(U.incomplete, 8, MUTED, 'italic'); y+=0.8*k; }

  // points forts / axes prioritaires
  if(A.strengths.length){
    const colW=(CW-5)/2, n=Math.max(A.strengths.length, A.priorities.length), boxH=8+n*5;
    const box=(title, arr, x)=>{
      doc.setDrawColor(...LINE); doc.roundedRect(x, y, colW, boxH, 2, 2, 'S');
      let yy=y+5;
      doc.setFont('helvetica','bold'); doc.setFontSize(7); setC(MUTED); doc.text(T(title).toUpperCase(), x+3.5, yy); yy+=5;
      arr.forEach(r=>{
        doc.setFont('helvetica','bold'); doc.setFontSize(8.8); setC(NAVY); doc.text(T((r.i+1)+'. '+r.name), x+3.5, yy);
        doc.setFont('helvetica','normal'); setC(INK); doc.text(fmtScore(r.v)+' / 5 · '+T(U.levels[levelOf(r.v)]), x+colW-3.5, yy, {align:'right'});
        yy+=5;
      });
    };
    box(U.strengthsH, A.strengths, M);
    if(A.priorities.length) box(U.prioritiesH, A.priorities, M+colW+5);
    y+=boxH; chk();
  }

  // ================= PAGE 2 : les 6 axes expliqués =================
  doc.addPage(); pageTop();
  h2(U.pdfAxesH); y+=0.5*k;
  U.explains.forEach((e,i)=>{
    const bh=6.6*k;
    doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, bh, 1.5, 1.5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9.6*k); setC(GOLD); doc.text((i+1)+'.', M+2.5, y+bh*0.68);
    setC(NAVY); doc.text(T(e.sum), M+8, y+bh*0.68);
    doc.setFontSize(8.6*k); setC(GOLD); doc.text(T(U.yourScore)+(LANG==='fr'?' : ':': ')+fmtScore(lastScores[i])+' / 5', M+CW-2.5, y+bh*0.68, {align:'right'});
    y+=bh+1.6*k;
    [[U.kDef,e.def],[U.kEx,e.ex],[U.kCrit,e.crit]].forEach(([kk,t])=>{ rich([[kk+' ','b'],[t]], 8.8, M+2, CW-4); y+=0.5*k; });
    y+=2.6*k;
  });
  chk();

  // ================= PAGE 3 : recommandations + bloc WeNego =================
  doc.addPage(); pageTop();
  const ABOUT_H = 35, ABOUT_TOP = 24;   // bloc WeNego : partie haute (texte / chiffres / bouton) + ligne CTA
  limit = BOTTOM - ABOUT_H - 4;          // place réservée au bloc WeNego
  h2(R.recH);
  para(R.recSub, 8.6, MUTED, 'italic'); y+=1.2*k;
  R.rec.forEach((r,i)=>{
    const isPrio=A.priorities.some(x=>x.i===i), bh=6.4*k;
    doc.setFillColor(...SOFT); doc.roundedRect(M, y, CW, bh, 1.5, 1.5, 'F');
    if(isPrio){ doc.setFillColor(...GOLD); doc.rect(M, y, 2, bh, 'F'); }
    doc.setFont('helvetica','bold'); doc.setFontSize(9.6*k); setC(GOLD); doc.text((i+1)+'.', M+3.5, y+bh*0.68);
    setC(NAVY); doc.text(T(r.t), M+9, y+bh*0.68);
    const tw=doc.getTextWidth(T(r.t));
    doc.setFont('helvetica','bolditalic'); doc.setFontSize(8.6*k); setC(INK);
    const room=CW-9-tw-6-40;
    const sub=doc.splitTextToSize(T(' — '+r.s), Math.max(20,room))[0];
    doc.text(sub, M+9+tw+1, y+bh*0.68);
    doc.setFont('helvetica','bold'); setC(GOLD);
    doc.text((isPrio ? T(R.prioTag)+'  ·  ' : '')+fmtScore(lastScores[i])+' / 5', M+CW-2.5, y+bh*0.68, {align:'right'});
    y+=bh+1.4*k;
    r.items.forEach(t=>bullet(t, 8.4));
    y+=2*k;
  });
  chk();

  // bloc WeNego (même contenu que le pied de la page résultat)
  {
    const y0 = BOTTOM - ABOUT_H, H = ABOUT_TOP, tw = CW*0.52;
    doc.setFillColor(...NAVY); doc.roundedRect(M, y0, CW, ABOUT_H, 2, 2, 'F');
    // texte
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6); setC(WHITE);
    const lines = doc.splitTextToSize(T(U.about.text), tw-8), st = stepOf(7.6,1.3);
    let ty = y0 + (H - lines.length*st)/2 + st*0.75;
    lines.forEach(l=>{ doc.text(l, M+5, ty); ty+=st; });
    // chiffres clés
    const sx = M + tw + 2;
    doc.setDrawColor(70,85,115); doc.setLineWidth(0.3); doc.line(sx-2, y0+4, sx-2, y0+H-4);
    U.about.stats.forEach((s,i)=>{
      const yy = y0 + 7.5 + i*5;
      doc.setFont('helvetica','bold'); doc.setFontSize(8); setC(GOLD); doc.text(T(s[0]), sx+2, yy);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.4); setC(PALE); doc.text(T(s[1]), sx+14, yy);
    });
    // bouton + lien
    const label = T(U.about.cta);
    doc.setFont('helvetica','bold'); doc.setFontSize(8);
    const bw = doc.getTextWidth(label)+8, bx = M+CW-5-bw, by = y0+H/2-3.5;
    doc.setFillColor(...GOLD); doc.roundedRect(bx, by, bw, 7, 3.5, 3.5, 'F');
    setC(NAVY); doc.text(label, bx+4, by+4.8);
    doc.link(bx, by, bw, 7, {url: U.about.url});

    // V20 : CTA échange gratuit de 30 min + email
    doc.setDrawColor(70,85,115); doc.setLineWidth(0.3); doc.line(M+5, y0+H, M+CW-5, y0+H);
    const cw = CW-10, cst = stepOf(7.8,1.3), mail = CONTACT_EMAIL;
    doc.setFont('helvetica','bold'); doc.setFontSize(7.8);
    const mailW = doc.getTextWidth(mail);
    doc.setFont('helvetica','normal');
    const cl = doc.splitTextToSize(T(U.about.contact), cw);
    const lastW = doc.getTextWidth(cl[cl.length-1]+' ');
    const inline = lastW + mailW <= cw;
    const mailLine = inline ? cl.length-1 : cl.length;
    const nL = mailLine + 1;
    const cy = y0 + H + (ABOUT_H - H - nL*cst)/2 + cst*0.75;
    setC(WHITE);
    cl.forEach((l,j)=>doc.text(l, M+5, cy + j*cst));
    const mx = inline ? M+5+lastW : M+5, my = cy + mailLine*cst;
    doc.setFont('helvetica','bold'); setC(GOLD); doc.text(mail, mx, my);
    doc.link(mx, my-cst*0.75, mailW, cst, {url:'mailto:'+mail});
  }

  // pieds de page
  const n=doc.getNumberOfPages();
  for(let pg=1;pg<=n;pg++){
    doc.setPage(pg);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, PH-9.5, PW-M, PH-9.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.3); setC(MUTED);
    doc.text(T(U.pdfFooter), M, PH-5.8); doc.text(pg+' / '+n, PW-M, PH-5.8, {align:'right'});
  }
  return {doc, overflow};
}


matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{ if(cur>=1&&cur<=NAX) updateMini(); });

document.querySelectorAll('#langbar button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
